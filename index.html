<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factors of Production</title>
<style>
:root{
  --bg:#F1EDE3;
  --card:#FFFFFF;
  --line:#E5DECD;
  --ink:#24322C;
  --sub:#68756E;
  --brand:#0E6E5C;
  --brand-deep:#0B5749;
  --brand-soft:#E4F1EC;
  --accent:#B96A0E;
  --accent-soft:#F8ECD9;
  --ok:#1E8E5A;
  --ok-soft:#E5F3EA;
  --bad:#C2413C;
  --bad-soft:#F9E8E6;
  --muted:#9AA39D;
}
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:440px;
  margin:0 auto;
  min-height:100dvh;
  background:#FBFAF5;
  display:flex;
  flex-direction:column;
  position:relative;
}
@media (min-width:480px){
  #app{margin:18px auto;border-radius:24px;min-height:calc(100dvh - 36px);box-shadow:0 10px 40px rgba(30,45,38,.14);overflow:hidden}
}
/* ---------- header ---------- */
.app-header{
  background:var(--brand);
  color:#fff;
  padding:14px 12px 10px;
  position:sticky;top:0;z-index:10;
}
.hd-row{display:flex;align-items:center;gap:6px}
.hd-back{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;flex:0 0 auto;
}
.hd-back:active{background:rgba(255,255,255,.26)}
.hd-title{flex:1;min-width:0}
.hd-title .t1{font-size:16px;font-weight:700;line-height:1.25}
.hd-title .t2{font-size:11px;opacity:.85;font-weight:400}
.hd-btn{
  background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:999px;
  font-size:12px;padding:6px 12px;cursor:pointer;flex:0 0 auto;
}
.hd-btn:active{background:rgba(255,255,255,.3)}
.hd-progress{padding:10px 4px 0}
.dots{display:flex;gap:4px;align-items:center}
.dot{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.28)}
.dot.done{background:#7FCFB8}
.dot.now{background:#F2C078}
.step-label{font-size:11px;opacity:.9;margin-top:6px}
.step-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.18);margin-right:6px;vertical-align:-5px}
.step-ic svg{width:14px;height:14px}
/* ---------- content ---------- */
.app-body{flex:1;padding:16px 16px 24px}
.sec-title{font-size:17px;font-weight:700;margin-bottom:4px}
.sec-sub{font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.6}
.en-term{color:var(--accent);font-weight:600}
.en-term.brand{color:var(--brand)}
/* ---------- cards & options ---------- */
.opt{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:#CFC6AE}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt .o-t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.opt .o-s{font-size:12px;color:var(--sub);margin-top:3px}
.opt .o-extra{font-size:12px;color:var(--accent);font-weight:600;margin-left:auto;white-space:nowrap}
.opt .o-mark{width:20px;height:20px;border-radius:50%;border:1.5px solid #CFC6AE;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.opt.sel .o-mark{border-color:var(--brand);background:var(--brand)}
.opt.dim{opacity:.55}
/* chips */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;
  background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-size:13px;user-select:none;
}
.chip .en{color:var(--accent);font-weight:600}
.chip.on{border-color:var(--brand);background:var(--brand-soft)}
.chip svg{flex:0 0 auto}
/* feedback */
.fb{border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0;line-height:1.6;display:none}
.fb.show{display:block;animation:fadein .2s ease}
.fb.info{background:var(--brand-soft);color:#0B5749}
.fb.ok{background:var(--ok-soft);color:#155E3C}
.fb.warn{background:var(--accent-soft);color:#7C4A0B}
.fb.bad{background:var(--bad-soft);color:#8A2C28}
.fb b{font-weight:700}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* classify */
.fcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.fcard.ans-land{border-color:var(--brand)}
.fcard.ans-labor{border-color:var(--accent)}
.fcard.ans-capital{border-color:#3B6FB6}
.fcard.ans-none{border-color:var(--muted)}
.fcard .f-top{display:flex;align-items:center;gap:8px}
.fcard .f-name{font-size:14px;font-weight:700}
.fcard .f-en{font-size:12px;color:var(--accent);font-weight:600}
.fcard .f-zh{font-size:12px;color:var(--sub);margin-left:auto}
.fcard .f-buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.bkt{
  font-size:12px;padding:7px 2px;border-radius:9px;border:1.5px solid var(--line);background:#FBF9F2;
  cursor:pointer;text-align:center;color:var(--sub);font-weight:600;
}
.bkt.sel-land{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.bkt.sel-labor{border-color:var(--accent);background:var(--accent-soft);color:#7C4A0B}
.bkt.sel-capital{border-color:#3B6FB6;background:#E8EFFA;color:#2C5490}
.bkt.sel-none{border-color:var(--muted);background:#EEF0EE;color:#5B635E}
.fcard .f-fb{font-size:12px;margin-top:8px;line-height:1.55;display:none}
.fcard .f-fb.show{display:block}
.fcard .f-fb.good{color:#155E3C}
.fcard .f-fb.bad{color:#8A2C28}
/* prices */
.prow{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.prow .p-q{font-size:13px;font-weight:600;margin-bottom:8px}
.prow .p-q .en{color:var(--accent)}
.prow .p-opts{display:flex;gap:8px}
.prow .p-opt{
  flex:1;text-align:center;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);
  cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);background:#FBF9F2;
}
.prow .p-opt.ok{border-color:var(--ok);background:var(--ok-soft);color:#155E3C}
.prow .p-opt.bad{border-color:var(--bad);background:var(--bad-soft);color:#8A2C28}
.prow .p-fb{font-size:12px;margin-top:7px;line-height:1.5;display:none}
.prow .p-fb.show{display:block}
.prow .p-fb.good{color:#155E3C}
.prow .p-fb.bad{color:#8A2C28}
/* tradeoffs */
.tq{margin-bottom:16px}
.tq .tq-t{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;gap:8px}
.tq .tq-t .num{background:var(--brand);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
/* english */
.etask{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.etask .et-q{font-size:14px;font-weight:600;margin-bottom:10px}
.etask .et-q .q-en{color:var(--accent)}
.et-opt{
  display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:#FBF9F2;font-size:13px;margin-bottom:8px;cursor:pointer;font-weight:600;color:var(--ink);
}
.et-opt.ok{border-color:var(--ok);background:var(--ok-soft);color:#155E3C}
.et-opt.bad{border-color:var(--bad);background:var(--bad-soft);color:#8A2C28}
.et-opt:disabled{cursor:default}
.et-fb{font-size:12px;margin-top:4px;line-height:1.55;display:none}
.et-fb.show{display:block}
.et-fb.good{color:#155E3C}
.et-fb.bad{color:#8A2C28}
.blank{
  display:inline-block;min-width:78px;padding:1px 8px;margin:0 3px;text-align:center;
  border-bottom:2px dashed var(--accent);font-weight:700;color:var(--accent);cursor:pointer;border-radius:0;
  vertical-align:baseline;
}
.blank.filled{background:var(--accent-soft);border-bottom-color:var(--accent)}
.blank.good{background:var(--ok-soft);border-bottom:2px solid var(--ok);color:#155E3C}
.blank.bad{background:var(--bad-soft);border-bottom:2px solid var(--bad);color:#8A2C28}
.tpl-sentence{font-size:14px;line-height:2.1;margin-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank .chip{font-size:13px}
.bank .chip:disabled{opacity:.45;cursor:default}
/* summary */
.sum-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sum-row:last-child{border-bottom:none}
.sum-row .k{color:var(--sub)}
.sum-row .v{font-weight:600;text-align:right}
.model-box{background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.8;color:#0B5749;margin-top:6px}
.idea-box{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.75;color:#7C4A0B;margin-top:10px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:#FBF9F2;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--sub)}
.tag b{color:var(--ink)}
/* footer action */
.app-foot{position:sticky;bottom:0;z-index:8;padding:10px 16px 16px;background:linear-gradient(180deg,rgba(251,250,245,0),rgba(251,250,245,.96) 40%)}
.btn{
  display:block;width:100%;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:700;
  cursor:pointer;background:var(--brand);color:#fff;transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub);font-weight:600}
.btn.ok-bg{background:var(--ok)}
/* home */
.hero{padding:22px 16px 6px;text-align:left}
.hero .h1{font-size:22px;font-weight:800;line-height:1.3}
.hero .h1 .en{display:block;font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em;margin-top:2px}
.hero .h2{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.7}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 8px}
.sc-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .1s;
}
.sc-card:active{transform:scale(.98)}
.sc-card:hover{border-color:#CFC6AE}
.sc-card .sc-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.f-ic{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.f-ic svg{width:19px;height:19px}
.ic-land{background:var(--brand-soft);color:var(--brand)}
.ic-labor{background:var(--accent-soft);color:var(--accent)}
.ic-capital{background:#E8ECF7;color:#4A63A6}
.ic-material{background:#EDE9E0;color:#8A7F6A}
.p-ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;margin-right:8px;vertical-align:-6px}
.p-ic svg{width:15px;height:15px}
.sc-card .sc-en{font-size:13px;font-weight:700;line-height:1.3}
.sc-card .sc-zh{font-size:12px;color:var(--sub)}
.sc-card .sc-go{font-size:11px;color:var(--accent);font-weight:700;margin-top:2px}
.concept-hero{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--sub);background:var(--brand-soft);border-radius:12px;padding:8px 11px;line-height:1.6;margin-bottom:10px}
.concept-hero svg{flex:0 0 auto;margin-top:2px;color:var(--brand)}
.concept-hero b{color:var(--brand-deep)}
.concept-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.concept-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--sub);font-size:11px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s}
.concept-tab svg{width:20px;height:20px}
.concept-tab.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.concept-main{min-height:300px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.cm-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.cm-en{font-size:18px;font-weight:800;line-height:1.2}
.cm-zh{font-size:12px;color:var(--sub)}
.cm-en-def{font-size:13.5px;color:#2E3A34;line-height:1.75;font-weight:600;margin-top:14px}
.cm-en-def b{color:var(--brand-deep)}
.cm-zh-def{font-size:13px;color:var(--sub);line-height:1.75;margin-top:10px}
.cm-tip{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 10px;line-height:1.6;margin-top:14px}
.cm-tip svg{flex:0 0 auto;margin-top:2px;color:var(--accent)}
.read-bar{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-radius:12px;padding:9px 11px}
.read-bar svg{flex:0 0 auto}
.read-bar.lock{color:#8A2C28;background:var(--bad-soft)}
.home-actions{padding:10px 16px 20px;display:flex;flex-direction:column;gap:10px}
.mini-note{text-align:center;font-size:11px;color:var(--muted);padding:0 16px 18px}
/* glossary modal */
.modal-mask{
  position:fixed;inset:0;background:rgba(24,32,28,.52);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
}
@media (min-width:480px){.modal-mask{align-items:center;padding:20px}}
.modal{
  background:#FBFAF5;width:100%;max-width:440px;max-height:82dvh;border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;overflow:hidden;animation:slideup .22s ease;
}
@media (min-width:480px){.modal{border-radius:22px}}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.modal-head .t{font-size:16px;font-weight:800;display:flex;align-items:center}
.mh-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);margin-right:8px;flex:0 0 auto}
.mh-ic svg{width:17px;height:17px}
.cat-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--accent);margin:14px 2px 8px}
.cat-ic{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.cat-ic svg{width:14px;height:14px}
.modal-close{width:30px;height:30px;border-radius:9px;border:none;background:#EEE9DC;color:var(--sub);font-size:15px;cursor:pointer;line-height:1}
.modal-body{overflow:auto;padding:12px 16px 22px}
.g-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.g-item .g-en{font-size:13px;font-weight:800;color:var(--brand)}
.g-item .g-zh{font-size:12px;color:var(--accent);font-weight:600;margin-left:6px}
.g-item .g-def{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* ---------- learning diagnosis ---------- */
.diag-top{display:flex;align-items:center;gap:14px;margin:2px 0 14px}
.ring{width:78px;height:78px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ring .ring-in{width:60px;height:60px;border-radius:50%;background:#FBFAF5;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-num{font-size:17px;font-weight:800;line-height:1.15}
.ring .ring-cap{font-size:10px;color:var(--sub)}
.diag-sum{font-size:13px;color:var(--sub);line-height:1.8}
.diag-sum b{color:var(--ink)}
.dim-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dim-label{font-size:12px;flex:0 0 76px;font-weight:600;color:#3A453F}
.dim-track{flex:1;height:12px;border-radius:8px;background:#ECE7D8;overflow:hidden}
.dim-fill{height:100%;border-radius:8px;min-width:2px}
.dim-num{font-size:12px;flex:0 0 78px;text-align:right;color:var(--sub);font-weight:600}
.dim-num .e{color:var(--bad);font-weight:700}
.advice-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.advice-box .a-t{font-size:13px;font-weight:800;margin-bottom:2px}
.advice-item{font-size:13px;line-height:1.7;color:#37413B;padding:8px 0;border-bottom:1px dashed var(--line)}
.advice-item:last-child{border-bottom:none}
.advice-item .a-dim{display:inline-block;font-size:11px;font-weight:700;color:#7C4A0B;background:var(--accent-soft);border-radius:6px;padding:1px 7px;margin-right:6px}
.advice-item.weak .a-dim{color:#8A2C28;background:var(--bad-soft)}
.advice-good{background:var(--ok-soft);border:1px solid #BFE3CF;border-radius:12px;padding:11px 13px;font-size:13px;color:#155E3C;margin-top:12px;line-height:1.75}
.advice-good b{font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ==================== ICONS ==================== */
function ic(inner){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';}
const ICONS = {
  coffee: ic('<path d="M7 9h10v5a5 5 0 0 1-10 0z"/><path d="M17 10h1.6a2 2 0 0 1 0 4H17"/><path d="M10 6.2c0-1-1-1-1-2"/><path d="M13.5 6.2c0-1-1-1-1-2"/><path d="M6 18h12"/>'),
  milktea: ic('<path d="M6.5 9h11l-1.4 11.2a1.6 1.6 0 0 1-1.6 1.3H9.5a1.6 1.6 0 0 1-1.6-1.3z"/><path d="M8.6 6.5h6.8"/><path d="M10 9l-.7 7"/><path d="M14 9l.7 7"/>'),
  noodle: ic('<path d="M4.5 12.5h15a7.5 7.5 0 0 1-15 0z"/><path d="M9.5 8.5v-3"/><path d="M14.5 8.5v-3"/><path d="M8 5.5h8"/>'),
  pet: ic('<circle cx="6" cy="12.5" r="1.7"/><circle cx="10.3" cy="8.4" r="1.7"/><circle cx="13.7" cy="8.4" r="1.7"/><circle cx="18" cy="12.5" r="1.7"/><path d="M12 13.2c-2 1.3-2.9 3-2.4 4.7.5 1.7 2.3 2.6 4.4 2.6s3.9-.9 4.4-2.6c.5-1.7-.4-3.4-2.4-4.7a6 6 0 0 0-4 0z"/>'),

  {cat:"factors", en:"Factors of Production", zh:"生产要素", def:"The resources used in the production process (also called inputs) to make goods and services. In this unit: labor, capital, and land. 生产过程中用于制造商品与服务的资源（又称投入），本单元指劳动、资本、土地。"},
  {cat:"factors", en:"Land", zh:"土地", def:"In economics, the natural resources provided by the earth — surface, minerals, water, forests — and the physical space used in production. Land is fixed in supply and immobile, so its supply curve is vertical. 经济学中的土地包括自然资源与生产空间；供给固定、不可移动。"},
  {cat:"factors", en:"Labor", zh:"劳动", def:"The human effort — physical and mental — that people contribute to production. Its price is wages. 生产中付出的人力（体力和脑力），价格是工资。"},
  {cat:"factors", en:"Capital", zh:"资本", def:"Physical assets used in production: machinery, buildings, tools, and equipment (also software and patents). Money is NOT capital — firms use money to acquire capital. 用于生产的实物资产（机器、厂房、设备、软件等）；钱本身不是资本，但可以用来购买资本。"},
  {cat:"factors", en:"Intermediate Good", zh:"中间投入品", def:"A good that is used up in producing another good, such as coffee beans or flour. It is NOT a factor of production. 在生产中被消耗掉的商品，如咖啡豆、面粉，不属于生产要素。"},
  {cat:"prices", en:"Wages", zh:"工资", def:"The price (income) of labor: all compensation paid to workers for physical or mental work. 劳动的价格（收入），支付给工人的全部报酬。"},
  {cat:"prices", en:"Wage Rate", zh:"工资率", def:"The amount of base wage paid per unit of time (per hour or day) or per unit of output. 单位时间（小时/天）或单位产出的工资额。"},
  {cat:"prices", en:"Interest", zh:"利息", def:"The price of capital; the income earned by the owner of capital. 资本的价格，资本所有者的收入。"},
  {cat:"prices", en:"Interest Rate", zh:"利率", def:"The percentage of interest to total capital over a certain period; it regulates the balance between capital supply and demand. 一定时期内利息占资本总额的百分比，调节资本供求。"},
  {cat:"prices", en:"Rent", zh:"租金（地租）", def:"The income derived from the ownership of land (and other gifts of nature); the price of land. 土地所有者因拥有土地获得的收入，即土地的价格。"},

  {cat:"prices", en:"Return on Capital", zh:"资本回报", def:"The profit a firm expects from investing its own money in capital. 企业用自有资金投资资本所期望的回报。"},
  {cat:"markets", en:"Firm", zh:"企业", def:"An organization that produces goods or services to sell and earn revenue. 以生产并出售商品或服务来获取收入的组织。"},
  {cat:"markets", en:"Factor Market", zh:"要素市场", def:"Where production factors are bought and sold: firms are the buyers, and the owners of factors are the sellers. 生产要素买卖的市场（企业为买方，要素所有者为卖方）。"},
  {cat:"markets", en:"Product Market", zh:"产品市场", def:"Where final goods and services are exchanged between producers and consumers. 最终商品与服务在生产者和消费者之间交易的市场。"},
  {cat:"markets", en:"Perfectly Competitive Market", zh:"完全竞争市场", def:"A market with numerous buyers and sellers, where no single firm can control prices. 买卖双方众多、单个企业无法控制价格的市场。"},
  {cat:"markets", en:"Monopoly", zh:"垄断", def:"A market in which a single firm dominates and can exert control over prices. 单一企业支配市场并能够影响价格。"},
  {cat:"markets", en:"Monopsony", zh:"买方垄断", def:"A market with only one buyer of a factor (e.g., a single employer), which can distort wages and employment. 要素市场只有一个买方（如唯一雇主），可能扭曲工资与就业。"},
  {cat:"markets", en:"Income Distribution", zh:"收入分配", def:"How the income from production is shared among factor owners: wages, interest, and rent. 生产收入在要素所有者之间的分配：工资、利息、地租。"},
  {cat:"demand", en:"Derived Demand", zh:"派生需求", def:"Demand for a factor that comes from the demand for the goods and services the factor helps produce. 由要素所生产的最终商品与服务需求引致的需求。"},
  {cat:"demand", en:"Joint Demand", zh:"联合需求", def:"Production needs more than one factor, so a firm's demand for factors is a combined demand for two or more of them. 生产需要多种要素，企业往往同时需求两种以上要素。"},
  {cat:"demand", en:"Demand for Labor", zh:"劳动需求", def:"The quantity of labor employers are willing and able to hire at a given wage rate; it has an inverse relationship with the wage rate. 一定工资率下雇主愿意且能够雇佣的劳动量，与工资率反向变动。"},
  {cat:"demand", en:"Supply of Labor", zh:"劳动供给", def:"The total hours workers are willing to work at a given wage rate. 一定工资率下工人愿意提供的总劳动时间。"},
  {cat:"demand", en:"Equilibrium", zh:"均衡", def:"The state where quantity demanded equals quantity supplied; factor prices settle at this point. 需求量等于供给量的状态，要素价格在此稳定。"},
  {cat:"demand", en:"Substitution", zh:"要素替代", def:"Using more of one factor and less of another when their relative prices change — e.g. machines instead of workers when wages rise. 要素相对价格变化时，用更多的一种要素替代另一种。"},
  {cat:"demand", en:"Complementarity", zh:"互补性", def:"The relationship between factors that are used together in production. 生产中相互配合使用的要素之间的关系。"},
  {cat:"demand", en:"Elasticity of Demand", zh:"需求弹性", def:"How strongly the quantity demanded responds to a change in price. 需求量对价格变化的敏感程度。"},
  {cat:"demand", en:"Factor Intensity", zh:"要素密集度", def:"Whether production relies more on capital (capital-intensive) or on labor (labor-intensive); automation makes production more capital-intensive. 生产更依赖资本还是劳动；自动化使生产更趋资本密集。"},
  {cat:"marginal", en:"Marginal Product", zh:"边际产品", def:"The additional output produced by employing one more unit of a factor, holding other factors constant. 保持其他要素不变，追加一单位要素带来的额外产出。"},
  {cat:"marginal", en:"Marginal Revenue Product (MRP)", zh:"边际收益产品", def:"The additional revenue from employing one more unit of a factor; MRP = MPL × MR. Firms hire up to the point where MRP equals the factor price. 追加一单位要素带来的额外收益；企业雇佣到 MRP 等于要素价格为止。"},
  {cat:"more", en:"Opportunity Cost", zh:"机会成本", def:"The value of the best alternative given up when making a choice; the hourly wage is the opportunity cost of leisure. 做出选择时放弃的最优替代方案的价值；小时工资就是闲暇的机会成本。"},
  {cat:"more", en:"Leisure", zh:"闲暇", def:"Time used outside the labor market: rest, recreation, housework, and so on. 工作之外用于休息、娱乐、家务等的时间。"},
  {cat:"more", en:"Utility", zh:"效用", def:"The satisfaction people derive from consuming goods and services; consumers demand products for utility. 人们从消费中获得的满足。"},
  {cat:"more", en:"Revenue", zh:"收入", def:"The money a firm receives from selling its output. 企业出售产品所获得的收入。"},

  {cat:"more", en:"Savings & Investment", zh:"储蓄与投资", def:"Households supply capital mainly through savings (bank deposits, bonds); firms demand capital to invest in equipment and expand. 家庭以储蓄提供资本，企业以投资形成资本需求。"}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function startScenario(id){
  S.scId=id; S.step=0; S.etask=0; S.picks=newPicks();

  S.screen="play"; render();
}

const DIMMETA = [
  {key:"land", label:"Land 土地"},
  {key:"labor", label:"Labor 劳动"},
  {key:"capital", label:"Capital 资本"},
  {key:"intermediate", label:"Intermediate Goods 中间投入品"},

];
function factorDim(r){ return r.factor===null ? "intermediate" : r.factor; }
function blankDim(b){
  if(b.key==="land"||b.key==="labor"||b.key==="capital") return b.key;
  if(b.key==="price") return "prices";
  return "english";
}
function track(dim, ok, unitKey){
  const st = S.picks.stats;
  if(!st.dims[dim]) st.dims[dim]={t:0,ok:0};
  st.dims[dim].t++;
  if(ok) st.dims[dim].ok++;
  if(unitKey!==undefined && st.unit[unitKey]===undefined) st.unit[unitKey]=ok;
}
function diag(){
  const dims = DIMMETA.map(function(m){
    const d = S.picks.stats.dims[m.key] || {t:0,ok:0};
    return { key:m.key, label:m.label, t:d.t, ok:d.ok, err:d.t-d.ok, acc:(d.t>0?Math.round(100*d.ok/d.t):null) };
  });
  const unitKeys = Object.keys(S.picks.stats.unit);
  const firstOk = unitKeys.filter(function(k){ return S.picks.stats.unit[k]; }).length;
  const totalT = dims.reduce(function(s,d){ return s+d.t; },0);
  const totalOk = dims.reduce(function(s,d){ return s+d.ok; },0);
  const totalErr = dims.reduce(function(s,d){ return s+d.err; },0);
  return { dims:dims, firstOk:firstOk, firstN:unitKeys.length, totalErr:totalErr, overallAcc:(totalT>0?Math.round(100*totalOk/totalT):null) };
}

function buildAdvice(s,d){
  const weak = d.dims.filter(function(x){ return x.t>0 && x.acc<60; });
  const mid = d.dims.filter(function(x){ return x.t>0 && x.acc>=60 && x.acc<80; });
  const items = [];
  weak.concat(mid).forEach(function(x){
    const a = ADVICE[x.key];
    if(a) items.push({key:x.key, label:a.t, text:a.s, level:(x.acc<60?1:2)});
  });
  const errRes = s.resources.filter(function(r){ return S.picks.stats.clsErrIds.indexOf(r.id)>-1; });
  if(errRes.length){
    const target = items.find(function(it){ return it.key==="intermediate" || it.key==="land" || it.key==="labor" || it.key==="capital"; });
    if(target) target.text += " You sorted these wrongly this run: "+errRes.map(function(r){return r.en;}).join(", ")+". 你这次把“"+errRes.map(function(r){return r.zh;}).join("、")+"”归错了类。";
  }
  if(items.length===0){
    return { all:true, text:"You have mastered the three factors — identification, pricing and trade-offs! Think further: when should a firm stop hiring? When MRP (marginal revenue product, MRP = MPL × MR) equals the wage rate — that is Unit 6 §6.2. 三大生产要素的识别、定价与权衡你都已经掌握！进阶思考：企业雇人应雇到 MRP（边际收益产品，MRP = MPL × MR）等于工资率（wage rate）时为止——这是教材 Unit 6 §6.2 的内容。" };
  }
  return { all:false, items:items };
}
function cumKey(){ return "fop_cum_v1"; }
function loadCum(){
  try{
    const r = JSON.parse(localStorage.getItem(cumKey())||"null");
    if(r && typeof r.n==="number") return r;
  }catch(e){}
  return {n:0, dims:{}};
}
function addCum(){
  const st = S.picks.stats;
  if(st.saved) return loadCum();
  st.saved = true;
  const c = loadCum();
  c.n++;
  DIMMETA.forEach(function(m){
    const d = st.dims[m.key];
    if(!d || !d.t) return;
    if(!c.dims[m.key]) c.dims[m.key]={t:0,ok:0};
    c.dims[m.key].t+=d.t; c.dims[m.key].ok+=d.ok;
  });
  try{ localStorage.setItem(cumKey(), JSON.stringify(c)); }catch(e){}
  return c;
}
function cumAcc(c){
  let t=0, ok=0;
  Object.keys(c.dims).forEach(function(k){ t+=c.dims[k].t; ok+=c.dims[k].ok; });
  return t>0 ? Math.round(100*ok/t) : null;
}
function dimBar(x){
  const acc = (x.acc===null?0:x.acc);
  const color = (x.acc===null?"#D8D2C0":(acc>=80?"var(--ok)":(acc>=60?"var(--accent)":"var(--bad)")));
  return '<div class="dim-item"><div class="dim-label">'+x.label+'</div>'+
    '<div class="dim-track"><div class="dim-fill" style="width:'+acc+'%;background:'+color+'"></div></div>'+
    '<div class="dim-num">'+(x.acc===null?"—":x.acc+"%")+(x.err>0?' <span class="e">×'+x.err+'</span>':'')+'</div></div>';
}
function renderDiag(s){
  const d = diag();
  const adv = buildAdvice(s,d);
  const ringColor = (d.overallAcc===null?"#E9E4D6":(d.overallAcc>=80?"var(--ok)":(d.overallAcc>=60?"var(--accent)":"var(--bad)")));
  let body = '<div class="sec-title">Learning Diagnosis 学习诊断</div>'+
    '<div class="diag-top">'+
      '<div class="ring" style="background:conic-gradient('+ringColor+' '+(d.overallAcc||0)+'%, #ECE7D8 0)"><div class="ring-in"><div class="ring-num" style="color:'+ringColor+'">'+(d.overallAcc===null?"—":d.overallAcc+"%")+'</div><div class="ring-cap">Accuracy 正确率</div></div></div>'+
      '<div class="diag-sum"><b>Points</b> 决策点 <b>'+d.firstN+'</b><br><b>First-try</b> 首次答对 <b>'+d.firstOk+'/'+d.firstN+'</b> · <b>Errors</b> 错误 <b>'+(d.totalErr>0?d.totalErr:'0')+'</b> 次<br>Accuracy = correct ÷ attempts 正确率 = 答对次数 ÷ 尝试次数，尝试越少越说明掌握</div>'+
    '</div>'+
    '<div class="dims">'+d.dims.map(dimBar).join("")+'</div>';
  if(adv.all){
    body += '<div class="advice-good"><b>Advice 建议：</b>'+adv.text+'</div>';
  } else {
    body += '<div class="advice-box"><div class="a-t">Advice 针对薄弱环节的建议</div>'+
      adv.items.map(function(it){
        return '<div class="advice-item '+(it.level===1?'weak':'')+'"><span class="a-dim">'+it.label+'</span>'+it.text+'</div>';
      }).join("")+'</div>';
  }
  return body;
}

const READ_KEY = "fop_read_v1", READ_MS = 2*60*1000;
let readMem = null, readTimer = null;
function readState(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(READ_KEY)||"null"); }catch(e){}
  if(s && typeof s.start==="number"){ readMem = s; return s; }
  if(readMem) return readMem;
  readMem = {start:Date.now(), done:false};
  try{ localStorage.setItem(READ_KEY, JSON.stringify(readMem)); }catch(e){}
  return readMem;
}
function readReady(){ const r = readState(); return r.done===true || (Date.now()-r.start)>=READ_MS; }
function readRemain(){
  const r = readState();
  if(r.done) return 0;
  const m = READ_MS-(Date.now()-r.start);
  if(m<=0){ r.done=true; try{ localStorage.setItem(READ_KEY, JSON.stringify(r)); }catch(e){} return 0; }
  return m;
}
function fmtMs(ms){
  const s = Math.max(1, Math.ceil(ms/1000));
  return ("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2);
}
function flashRead(){
  const el = document.querySelector(".read-bar.lock");

}

            (ans===oi?'<div class="fb '+(o.best?'ok':'warn')+' show">'+(o.best?'✓ ':'<b>Hint:</b> ')+o.fb+'</div>':'')+
            '</div>';
        }).join("")+'</div>';
    }).join("");
}
function renderEnglish(s){
  const t = s.englishTasks[S.etask];
  const isLast = S.etask===s.englishTasks.length-1;
  let taskHtml = (t.type==="choice") ? renderChoice(s,t) : renderTemplate(s,t);
  return '<div class="sec-title">Step 7 · English</div>'+
    '<div class="sec-sub"><b>Speak economics in English.</b> Task '+(S.etask+1)+'/'+s.englishTasks.length+'</div>'+
    taskHtml+
    '<button class="btn '+(isLast?'ok-bg':'')+'" data-act="engNext" '+(S.picks.engDone[S.etask]?'':'disabled')+'>'+(isLast?'View Summary':'Next Task')+'</button>';
}
function renderChoice(s,t){
  const p = S.picks, ti = S.etask, ans = p.eng[ti];
  return '<div class="etask"><div class="et-q"><span class="q-en">Task</span> · '+t.prompt+'</div>'+
    t.options.map(function(o,oi){
      const state = ans===oi?(o.correct?'ok':'bad'):'';
      return '<button class="et-opt '+state+'" data-act="eng" data-ti="'+ti+'" data-oi="'+oi+'">'+o.text+'</button>'+
        (ans===oi?'<div class="et-fb show '+(o.correct?'good':'bad')+'">'+(o.correct?'✓ ':'Think again: ')+o.explain+'</div>':'');
    }).join("")+'</div>';
}
function bankText(t,key){
  const b = t.bank.find(function(x){ return x.key===key; });
  return b ? b.text : key;
}
function blankLabel(b){
  if(b.label) return b.label;
  const f = FACTORS.find(function(x){ return x.key===b.key; });
  return f ? f.en+'（'+f.zh+'）' : b.key;
}
function renderTemplate(s,t){
  const p = S.picks, ti = S.etask, fill = p.eng[ti] || {};
  const used = Object.keys(fill).map(function(i){ return fill[i]; });
  let bi = 0;
  const sentenceHtml = t.sentence.replace(/___/g, function(){
    const idx = bi++;
    const fk = fill[idx];
    return '<span class="blank '+(fk!==undefined?(fk===t.blanks[idx].key?'good':'bad'):'')+'" data-act="clearBlank" data-bi="'+idx+'">'+(fk!==undefined?bankText(t,fk):'___')+'</span>';
  });
  const allFilled = Object.keys(fill).length===t.blanks.length;
  const allGood = allFilled && t.blanks.every(function(b,i){ return fill[i]===b.key; });
  if(allFilled && !allGood) p.engDone[ti]=false;
  let fb = "";
  if(allFilled){
    if(allGood){ fb='<div class="et-fb show good">✓ Perfect! Your sentence is correct.</div>'; }
    else {
      const badIdx = t.blanks.map(function(b,i){ return fill[i]===b.key?-1:i; }).filter(function(i){ return i>-1; });
      const hints = badIdx.map(function(i){
        const chip = t.bank.find(function(x){ return x.key===fill[i]; });
        if(fill[i]==="none" && chip) return '"'+chip.text+'" is an intermediate good, not a factor.';
        return 'Blank '+(i+1)+' needs '+blankLabel(t.blanks[i]);
      });
      fb='<div class="et-fb show bad">Almost there: '+hints.join(' ')+' Tap a filled blank to clear it.</div>';
    }
  }
  return '<div class="etask">'+
    '<div class="et-q"><span class="q-en">Task</span> · '+t.prompt+'</div>'+
    '<div class="tpl-sentence">'+sentenceHtml+'</div>'+
    '<div class="bank">'+
    t.bank.map(function(b){
      const usedNow = used.indexOf(b.key)>-1;
      return '<div class="chip '+(usedNow?'on':'')+'" data-act="engBlank" data-key="'+b.key+'" style="'+(usedNow?'pointer-events:none;opacity:.5':'')+'">'+b.text+'</div>';
    }).join("")+'</div>'+
    fb+'</div>';
}
function renderSummary(s){
  const p = S.picks;
  const score = s.resources.filter(function(r){ return p.cls[r.id]===correctBucket(r); }).length;
  const loc = s.locations[p.loc], st = s.staff[p.staff];
  const chosenRes = s.resources.filter(function(r){ return p.res[r.id]; });
  const selDist = chosenRes.filter(function(r){ return r.factor===null; });
  return '<div class="sec-title">Business Report 经营报告 · '+s.nameZh+'</div>'+
    '<div class="sum-card">'+
    '<div class="sum-row"><span class="k">Location 选址</span><span class="v">'+loc.label+'（'+loc.rent+'）</span></div>'+
    '<div class="sum-row"><span class="k">Staff 员工</span><span class="v">'+st.label+' · '+st.cost+'</span></div>'+
    '<div class="sum-row"><span class="k">Resources 资源清单</span><span class="v">'+chosenRes.map(function(r){return r.en;}).join(", ")+'</span></div>'+
    '<div class="sum-row"><span class="k">Classify Correct 分类正确</span><span class="v">'+score+'/'+s.resources.length+'</span></div>'+
    (selDist.length?'<div class="sum-row"><span class="k">Did You Know 你知道吗</span><span class="v">'+selDist.map(function(r){return r.en;}).join(", ")+' are intermediate goods, not factors 是中间投入品，不是生产要素</span></div>':'')+
    '</div>'+
    '<div class="sec-sub"><b>Introduce your business in English</b> 你的生意用英语这样介绍：</div>'+
    '<div class="model-box">'+s.model+'</div>'+
    '<div class="idea-box"><b>Core Idea 经济学核心：</b>Firms demand factors of production — land, labor and capital — not to own them, but to produce <b>goods and services</b> and earn <b>revenue</b>. So a firm chooses how much labor, capital and land to use by comparing cost (rent, wages, interest) with expected revenue, and adjusts the mix when prices change. 企业需求生产要素不是为了“拥有”资源，而是为了生产商品与服务、获得收益；因此会按成本与预期收益决定要素用量，价格变化时调整组合。</div>'+
    '<div class="tag-row"><span class="tag"><b>Land</b> → rent</span><span class="tag"><b>Labor</b> → wages</span><span class="tag"><b>Capital</b> → interest / return</span></div>'+
    renderDiag(s)+
    '<div style="height:12px"></div>'+
    '<button class="btn" data-act="home">Home 再开一家店</button>'+
    '<div style="height:10px"></div>'+
    '<button class="btn ghost" data-act="glossary">Review Glossary 复习概念卡</button>'+
    '<div style="height:6px"></div>'+
    '<button class="btn ghost" data-act="restart">Replay 重玩本店</button>';
}
const stepBodies = [renderLocation, renderResources, renderStaff, renderClassify, renderPrices, renderTradeoffs, renderEnglish, renderSummary];

/* ==================== HANDLERS ==================== */
function doBack(){
  if(S.step===0){ S.screen="home"; render(); return; }
  if(S.step===6 && S.etask>0){ S.etask--; }
  else { S.step--; }
  render();
}
function doNext(){
  if(S.step===6){
    if(!S.picks.engDone[S.etask]) return;
    if(S.etask < sc().englishTasks.length-1){ S.etask++; render(); return; }
    S.step=7; S.doneCount++; addCum(); render(); return;
  }
  if(!canNext()) return;
  S.step++; render();
}
function handle(act,d){
  const p = S.picks;
  switch(act){
    case "concept": S.concept = d.id; render(); break;
    case "goHome": if(readReady()){ S.screen="home"; render(); } break;
    case "concepts": S.screen="concepts"; render(); break;
    case "home": S.screen="home"; render(); break;
    case "start": if(!readReady()){ flashRead(); return; } startScenario(d.id); break;
    case "glossary": openGlossary(); break;
    case "back": doBack(); break;
    case "next": doNext(); break;
    case "loc": p.loc=+d.i; render(); break;
    case "res": p.res[d.id]=!p.res[d.id]; render(); break;
    case "staff": p.staff=+d.i; render(); break;
    case "cls": {
      const r = sc().resources.find(function(x){ return x.id===d.id; });
      const ok = (d.bucket===correctBucket(r));
      track(factorDim(r), ok, "cls:"+d.id);
      if(!ok && S.picks.stats.clsErrIds.indexOf(d.id)<0) S.picks.stats.clsErrIds.push(d.id);
      p.cls[d.id]=d.bucket; render(); break;
    }
    case "price": {
      const f = FACTORS.find(function(x){ return x.key===d.factor; });
      track("prices", d.p===f.price, "price:"+d.factor);
      p.price[d.factor]=d.p; render(); break;
    }
    case "to": {
      const tq = sc().tradeoffs[+d.qi], o = tq.options[+d.oi];
      track("tradeoff", o.best===true, "to:"+d.qi);
      p.to[+d.qi]=+d.oi; render(); break;
    }
    case "eng": {
      const t = sc().englishTasks[+d.ti], o = t.options[+d.oi];
      track("english", o.correct===true, "engc:"+d.ti);
      p.eng[+d.ti]=+d.oi; p.engDone[+d.ti]=(o.correct===true); render(); break;
    }
    case "engBlank": {
      const ti = S.etask;
      const t = sc().englishTasks[ti];
      if(!p.eng[ti]) p.eng[ti] = {};
      const fill = p.eng[ti];
      let idx = 0;
      while(idx<t.blanks.length && fill[idx]!==undefined) idx++;
      if(idx<t.blanks.length){
        fill[idx]=d.key;
        track(blankDim(t.blanks[idx]), d.key===t.blanks[idx].key, "engb:"+ti+":"+idx);
      }
      p.engDone[ti] = t.blanks.every(function(b,i){ return fill[i]===b.key; });
      render(); break;
    }
    case "clearBlank": if(p.eng[S.etask]) delete p.eng[S.etask][+d.bi]; p.engDone[S.etask]=false; render(); break;
    case "engNext": doNext(); break;
    case "restart": startScenario(S.scId); break;
  }
}

/* ==================== GLOSSARY MODAL ==================== */
function openGlossary(){
  closeGlossary();
  const m = document.createElement("div");
  m.id = "glossaryModal";
  m.className = "modal-mask";
  m.innerHTML = '<div class="modal">'+
    '<div class="modal-head"><span class="t"><span class="mh-ic">'+ICONS.book+'</span>Glossary 概念卡</span><button class="modal-close" aria-label="关闭">'+ICONS.close+'</button></div>'+
    '<div class="modal-body">'+
    GLOSSARY_CATS.map(function(c){
      const items = GLOSSARY.filter(function(g){ return g.cat===c[0]; });
      if(!items.length) return "";
      return '<div class="cat-t"><span class="cat-ic">'+ICONS[CAT_ICON[c[0]]]+'</span>'+CAT_EN[c[0]]+' '+c[1]+'</div>'+
        items.map(function(g){
          return '<div class="g-item"><div><span class="g-en">'+g.en+'</span><span class="g-zh">'+g.zh+'</span></div><div class="g-def">'+g.def+'</div></div>';
        }).join("");
    }).join("")+
    '</div></div>';
  document.body.appendChild(m);
  m.addEventListener("click", function(ev){
    if(ev.target===m || ev.target.closest(".modal-close")) closeGlossary();
  });
}
function closeGlossary(){
  const m = document.getElementById("glossaryModal");
  if(m) m.parentNode.removeChild(m);
}

/* ==================== INIT ==================== */
render();
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  handle(el.dataset.act, el.dataset);
});
</script>
