<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智猪博弈 The Smart Pig Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='40' fill='%23f06292'/%3E%3Cpath d='M16 34q-10-14 8-16 14 4 12 18z' fill='%23f06292'/%3E%3Cpath d='M84 34q10-14-8-16-14 4-12 18z' fill='%23f06292'/%3E%3Ccircle cx='38' cy='50' r='5' fill='%23333'/%3E%3Ccircle cx='62' cy='50' r='5' fill='%23333'/%3E%3Cellipse cx='50' cy='68' rx='17' ry='13' fill='%23e91e63'/%3E%3Ccircle cx='45' cy='67' r='3' fill='%23fff'/%3E%3Ccircle cx='55' cy='67' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --pink:#f06292; --pink-2:#e91e63; --pink-3:#c2185b;
  --pink-50:#fff0f5; --pink-100:#fce4ec;
  --cream:#fff8f1; --card:#fff;
  --ink:#3d2b2b; --muted:#9a8a8a;
  --green:#2e7d32; --green-bg:#e8f5e9; --green-bd:#a5d6a7;
  --red:#c62828; --red-bg:#ffebee; --red-bd:#ef9a9a;
  --line:#f3dfe7;
  --shadow:0 6px 16px rgba(192,24,91,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#efe6ea;display:flex;justify-content:center;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
#app{width:100%;max-width:480px;height:100dvh;background:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}

/* ===== 1. 顶部黑色导航（常驻） ===== */
.header{background:#17151a;color:#fff;padding:14px 18px 12px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:20}
.header-title{font-size:24px;font-weight:900;letter-spacing:1px}
.header-right{display:flex;align-items:center;gap:10px;font-size:16px}
.header-brand{font-size:16px;font-weight:700;color:#fff}
.header-credits{display:flex;flex-direction:column;gap:1px;text-align:left;font-size:10.5px;line-height:1.45;color:#cfd8ff;white-space:nowrap}
.header-credits b{color:#fff;font-weight:700}
.dots-btn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s}
.dots-btn:hover{background:rgba(255,255,255,.18)}
.dots-btn svg{width:20px;height:20px;fill:currentColor}
.lang-menu{position:absolute;top:60px;right:14px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;z-index:30;display:none;min-width:140px}
.lang-menu.open{display:block}
.lang-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;text-align:left;font-size:14px;color:var(--ink)}
.lang-menu button:hover{background:var(--pink-50);color:var(--pink-3)}
.lang-menu svg{width:16px;height:16px;fill:currentColor}

/* ===== 2. 白色标签栏（常驻：左侧课程名 + 右侧横滑标签） ===== */
.nav-scroll{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid #f0e6ea}
.course-name{flex:none;font-size:16px;font-weight:900;color:#17151a;white-space:nowrap;letter-spacing:.5px}
.nav-pills{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;cursor:grab;user-select:none;
  -webkit-mask-image:linear-gradient(to right,#000 88%,transparent 100%);
          mask-image:linear-gradient(to right,#000 88%,transparent 100%)}
.nav-pills.dragging{cursor:grabbing}
.nav-pills::-webkit-scrollbar{display:none}
.nav-tab{padding:9px 13px;min-height:42px;display:inline-flex;align-items:center;border-radius:22px;font-size:13px;font-weight:700;color:#666;background:#f6f1f3;white-space:nowrap;flex-shrink:0;transition:.25s}
.nav-tab.active{background:linear-gradient(135deg,var(--pink),var(--pink-2));color:#fff;box-shadow:0 4px 10px rgba(240,98,146,.35)}

/* ===== 内容区 ===== */
.content{flex:1;overflow-y:auto;padding:18px 16px 36px}
.page{display:none;animation:fadeUp .3s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.course-label{display:inline-block;font-size:14px;font-weight:700;color:var(--pink-3);background:#fff;border:1.5px solid var(--pink-100);padding:6px 14px;border-radius:16px;margin-bottom:14px}
.page-title{font-size:28px;font-weight:900;color:var(--pink-3);text-align:center;margin:6px 0 18px}
.rule-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.7}
.rule-card.task{background:var(--pink-50);border-color:var(--pink-100)}
.rule-card b{color:var(--pink-3)}
/* 规则页小演示：用真实猪图的迷你舞台 */
.mini-stage{position:relative;margin-top:10px;height:clamp(132px,22vh,190px);background:#fffdf5;border:1.5px dashed var(--pink-100);border-radius:12px;overflow:hidden}
.demo-play{margin-top:10px;width:100%;padding:9px;background:#fff;color:var(--pink-3);border:2px solid var(--pink);border-radius:20px;font-size:14px;font-weight:800;min-height:44px}
.demo-play:active{transform:scale(.97)}
.ms-btn{position:absolute;top:10px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a94,#e53935 72%);transition:transform .15s;z-index:3}
.ms-btn.pressed{transform:scale(.78)}
.ms-trough{position:absolute;bottom:16px;left:50%;width:70px;height:18px;margin-left:-35px;border:3px solid #bcdff0;border-radius:7px;background:#fff;z-index:1}
.ms-food{position:absolute;left:0;right:0;top:0;height:100%;border-radius:4px;background:url('https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/food.png') center/cover no-repeat;opacity:0;transform:scaleY(0);transform-origin:bottom;transition:opacity .3s,transform .3s}
.ms-food.show{opacity:1;transform:scaleY(1)}
.ms-pig{position:absolute;width:110px;height:110px;object-fit:contain;z-index:4;left:18px;bottom:6px;top:auto}
.ms-pig.sm{width:88px;height:88px;left:auto;right:18px;bottom:8px;top:auto}
.ms-bolt{position:absolute;opacity:0;transition:opacity .25s;font-size:13px;font-weight:900;background:#fff;border-radius:10px;padding:3px 9px;z-index:5;pointer-events:none;white-space:nowrap}
.ms-bolt.show{opacity:1}
.ms-bolt.plus{color:var(--green);border:2px solid var(--green-bd)}
.ms-bolt.minus{color:var(--red);border:2px solid var(--red-bd)}
.ms-drop{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#ffa726;opacity:0;z-index:3;transition:top .7s ease-in,opacity .2s}
.ms-lbl{position:absolute;font-size:11px;font-weight:800;color:#8a7580;background:#fff;border-radius:8px;padding:1px 7px;z-index:4;white-space:nowrap}
.ms-lbl.btn-lbl{top:44px;left:50%;transform:translateX(-50%)}
.ms-lbl.tr-lbl{bottom:0;left:50%;transform:translateX(-50%)}
.ms-cap{margin-top:8px;font-size:14px;font-weight:700;color:var(--pink-3);background:var(--pink-50);border-radius:10px;padding:9px 12px;min-height:40px;text-align:center;line-height:1.4}
.btn-pink{width:100%;padding:16px;background:linear-gradient(135deg,var(--pink),var(--pink-2));color:#fff;border-radius:30px;font-size:17px;font-weight:800;box-shadow:0 8px 18px rgba(233,30,99,.35);transition:transform .15s;margin-top:8px}
.btn-pink:active{transform:scale(.97)}
.btn-ghost{width:100%;padding:15px;background:#fff;color:var(--pink-3);border:2px solid var(--pink);border-radius:30px;font-size:16px;font-weight:800;transition:transform .15s}
.btn-ghost:active{transform:scale(.97)}

/* ===== 规则三步互动课堂（防跳过机制） ===== */
.rule-grid{display:flex;flex-direction:column}
#page-intro .rule-card{margin-bottom:10px}
.rule-model{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:10px;box-shadow:var(--shadow);font-size:15px;line-height:1.65}
.rule-model summary{cursor:pointer;font-weight:800;color:var(--pink-3);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15.5px;min-height:42px}
.rule-model summary::-webkit-details-marker{display:none}
.rule-model summary::after{content:"▾";color:var(--pink);font-size:13px;flex:none;transition:transform .25s}
.rule-model[open] summary::after{transform:rotate(180deg)}
.rule-model .model-body{padding:8px 2px 6px;color:var(--ink);font-size:14.5px}
.rule-tabs{display:flex;gap:8px;margin-bottom:10px}
.rule-tab{flex:1;min-height:48px;padding:6px 4px;border-radius:14px;border:2px solid var(--pink-100);background:#fff;color:#8a7580;font-size:13.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.2s;line-height:1.25;text-align:center}
.rule-tab .rt-num{font-size:11px;opacity:.7}
.rule-tab.active{border-color:var(--pink);color:var(--pink-3);background:var(--pink-50);box-shadow:0 4px 10px rgba(240,98,146,.18)}
.rule-tab.done{border-color:var(--green-bd);color:#2e7d32}
.rule-tab.done .rt-num{display:none}
.rule-tab.done::before{content:"✓";font-size:14px;font-weight:900;color:var(--green);line-height:1}
.rule-tab.attention{animation:tabPulse 1.6s ease-in-out infinite}
@keyframes tabPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,98,146,.45)}50%{box-shadow:0 0 0 8px rgba(240,98,146,0)}}
.rule-panel[hidden]{display:none}
.rule-line b{color:var(--pink-3)}
#btnStart:disabled{background:#e9e2e5;box-shadow:none;color:#a08d95;cursor:not-allowed}
#btnStart:disabled:active{transform:none}
#introToast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:rgba(61,50,56,.94);color:#fff;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:99;max-width:86vw;text-align:center}
#introToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-height:900px){
  .page-title{font-size:22px;margin:2px 0 10px}
  .rule-model{padding:6px 14px;margin-bottom:8px}
  .rule-model summary{min-height:36px;font-size:14.5px}
  .rule-model .model-body{font-size:13px;padding:6px 2px 4px}
  #page-intro .rule-card{padding:10px 14px;font-size:14px;line-height:1.55;margin-bottom:8px}
  .mini-stage{height:clamp(110px,18vh,150px)}
  .ms-pig{width:96px;height:96px}
  .ms-pig.sm{width:76px;height:76px}
  .ms-cap{font-size:12.5px;padding:6px 10px}
  .demo-play{padding:7px;font-size:13px;margin-top:8px;min-height:38px}
  .rule-tabs{margin-bottom:8px}
  .rule-tab{min-height:42px;font-size:12.5px}
  .content{padding:12px 14px 26px}
}
@media (max-height:720px){
  .page-title{font-size:19px;margin:0 0 8px}
  .rule-model{margin-bottom:6px}
  .rule-model summary{min-height:32px;font-size:13.5px}
  #page-intro .rule-card{padding:8px 12px;font-size:13px;line-height:1.5;margin-bottom:6px}
  .mini-stage{height:clamp(120px,20vh,160px)}
  .ms-pig{width:88px;height:88px}
  .ms-pig.sm{width:70px;height:70px}
  .ms-cap{font-size:12px;padding:4px 8px;min-height:30px}
  .demo-play{min-height:34px;padding:5px;font-size:12px;margin-top:6px}
  .rule-tabs{gap:6px;margin-bottom:6px}
  .rule-tab{min-height:36px;font-size:12px}
  .content{padding:8px 12px 20px}
  #btnStart{padding:11px;font-size:15px}
}

/* ===== 游戏场景 ===== */
.game-scene{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px 14px 16px;box-shadow:var(--shadow)}
.food-dispenser{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.food-circle{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a94,#e53935 72%);box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),0 4px 12px rgba(229,57,53,.4)}
.food-circle.pulse{animation:pulse .7s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.food-label{font-size:14px;font-weight:800;color:var(--pink-3);background:#fff;border:1.5px solid var(--pink-100);padding:4px 12px;border-radius:12px;margin-top:8px}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:6px}
.pig-side{width:42%;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px}
.pig-side .pig-img{order:0}
.pig-side .bubbles{order:1}
.pig-side .pig-tag{order:2}
.pig-side.small .bubbles{order:0}
.pig-side.small .pig-img{order:1}
.pig-side.small .pig-tag{order:2}
.bubbles{display:flex;flex-direction:column;gap:8px;align-items:center}
.bubble{display:flex;align-items:center;gap:7px;min-height:44px;background:#fff;border:2px solid var(--pink);border-radius:16px;padding:8px 14px;font-size:14px;font-weight:800;color:var(--ink);position:relative;transition:.2s}
.bubble svg{width:18px;height:18px;flex:none}
.bubble::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:8px solid transparent;border-left:0;border-right-color:var(--pink);left:-8px}
.pig-side.small .bubble::after{border-right:0;border-left-color:var(--pink);left:auto;right:-8px}
.bubble.selected{background:linear-gradient(135deg,var(--pink),var(--pink-2));color:#fff;border-color:var(--pink-2)}
.bubble.selected::after{border-right-color:var(--pink-2)}
.pig-side.small .bubble.selected::after{border-left-color:var(--pink-2)}
.bubble:active{transform:scale(.95)}
.pig-img{width:128px;height:128px;object-fit:contain;display:block}
.pig-side.small .pig-img{width:100px;height:100px}
.pig-tag{font-size:14px;font-weight:800;color:var(--pink-3);margin-top:2px}
.pig-side.small .pig-tag{color:#4a7ba6}
.trough{width:90px;height:40px;background:#fff;border:3px solid #bcdff0;border-radius:8px;align-self:flex-end;margin-bottom:18px;position:relative;overflow:hidden}
/* trough inner overlay removed so food image fills it */
.hint{text-align:center;font-size:15px;font-weight:700;color:#8d6e63;margin:16px 0 14px}

/* ===== 游戏动画 ===== */
.game-scene{position:relative;overflow:hidden}
.game-scene .bubbles{transition:opacity .25s}
.game-scene.play .bubbles{opacity:0;pointer-events:none}
.bolt{position:absolute;z-index:20;display:flex;align-items:center;gap:3px;padding:3px 9px;border-radius:14px;font-size:15px;font-weight:900;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translate(-50%,-100%) scale(.5);transition:opacity .3s,transform .3s;pointer-events:none}
.bolt.show{opacity:1;transform:translate(-50%,-110%) scale(1)}
.bolt.minus{color:#c62828;border:2px solid #ef9a9a}
.bolt.minus svg{fill:#e53935}
.bolt.plus{color:#2e7d32;border:2px solid #a5d6a7}
.bolt.plus svg{fill:#43a047}
.food-pile{position:absolute;left:0;right:0;top:0;height:100%;border-radius:5px;background:url('https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/food.png') center/cover no-repeat;opacity:0;transform:scaleY(0);transform-origin:bottom;transition:opacity .3s,transform .3s;pointer-events:none}
.food-pile.show{opacity:1;transform:scaleY(1)}
.food-circle{transition:transform .18s ease}

/* 饱腹值条 */
.satiety{margin-top:-4px;margin-bottom:12px}
.sat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sat-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.1);flex:none}
.sat-track{flex:1;height:26px;background:#fff;border:2px solid #f3c6d6;border-radius:14px;position:relative;overflow:hidden}
.sat-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd54f,var(--pink));border-radius:12px;transition:width .7s ease}
.sat-num{flex:none;min-width:58px;text-align:right;font-size:16px;font-weight:900;color:var(--pink-3)}
.sat-num.neg{color:var(--red)}

/* ===== 理论页 ===== */
.theory-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.theory-card h2{font-size:17px;color:var(--pink-3);margin-bottom:10px}
.theory-card p{font-size:15px;line-height:1.75;color:#4d3b3b}
.matrix{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;margin-top:6px}
.matrix th,.matrix td{border:1.5px solid #f0ccd9;padding:10px 6px;text-align:center;border-radius:8px}
.matrix thead th{background:var(--pink-50);color:var(--pink-3);font-size:13px}
.matrix tbody th{background:#faf3f6;color:#7a4a5c;font-size:13px;font-weight:800}
.matrix td{font-weight:800;color:#5b3a3a;background:#fff}
.matrix td.hl{background:var(--pink-100);color:var(--pink-3)}
.vocab{list-style:none}
.vocab li{font-size:14.5px;line-height:1.7;padding:6px 0;border-bottom:1px dashed #f0d8e0}
.vocab li:last-child{border-bottom:0}
.vocab b{color:var(--pink-3)}

/* ===== 测验页 ===== */
.quiz-q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.quiz-q .q-stem{font-size:15.5px;font-weight:800;line-height:1.6;margin-bottom:10px}
.quiz-opt{display:block;width:100%;text-align:left;background:#faf3f6;border:2px solid transparent;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;color:var(--ink);transition:.2s}
.quiz-opt .opt-letter{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#fff;align-items:center;justify-content:center;font-weight:800;margin-right:8px;font-size:12px;color:var(--pink-3)}
.quiz-opt.selected{border-color:var(--pink);background:var(--pink-50)}
.quiz-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.quiz-opt:disabled{cursor:default}
.result-banner{display:none;text-align:center;background:var(--pink-50);border:2px solid var(--pink-100);border-radius:16px;padding:16px;margin-bottom:14px}
.result-banner.show{display:block}
.result-banner .score-big{font-size:26px;font-weight:900;color:var(--pink-3)}
.result-banner .score-sub{font-size:13.5px;color:var(--muted);margin-top:4px}

/* ===== 结算弹窗 ===== */
.modal-mask{position:absolute;inset:0;background:rgba(30,10,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:22px}
.modal-mask[hidden]{display:none}
.modal-card{background:#fff;border-radius:22px;padding:24px 22px;width:100%;max-width:340px;text-align:center;animation:pop .3s ease;box-shadow:0 16px 40px rgba(0,0,0,.25)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h2{font-size:19px;color:var(--pink-3);margin-bottom:10px}
.modal-nums{display:flex;justify-content:center;gap:14px;margin:6px 0 10px}
.modal-num{background:var(--pink-50);border:1.5px solid var(--pink-100);border-radius:14px;padding:8px 16px}
.modal-num .n{font-size:24px;font-weight:900;color:var(--pink-3)}
.modal-num .l{font-size:13px;color:var(--muted)}
.modal-card p.body{font-size:14.5px;line-height:1.7;color:#4d3b3b;text-align:left}
.modal-card .tip-line{font-size:13px;color:var(--muted);margin-top:8px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn-again{flex:1;padding:13px;background:#fff;color:var(--pink-3);border:2px solid var(--pink);border-radius:24px;font-size:15px;font-weight:800}
.btn-end{flex:1.3;padding:13px;background:linear-gradient(135deg,var(--pink),var(--pink-2));color:#fff;border-radius:24px;font-size:15px;font-weight:800}
/* ===== 横版/桌面宽屏 ===== */
@media (min-width:720px){
  #app{max-width:1040px;box-shadow:0 0 60px rgba(0,0,0,.12)}
  .content{padding:28px 36px 48px}

.ch-pts{font-size:18px;font-weight:bold;color:#c2185b;margin-top:2px}

.ch-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}

.btn-start{width:100%;padding:22px;background:linear-gradient(135deg,#e91e63,#f06292);color:#fff;border:none;border-radius:36px;font-size:22px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 24px rgba(233,30,99,.45);cursor:pointer;margin-top:16px;transition:transform .15s,box-shadow .15s}

<body>
<div id="app">
  <audio id="bgmAudio" loop preload="auto"></audio>
  <!-- ===== 黑色顶部栏 ===== -->
  <header class="header">
    <div class="header-title">智猪博弈</div>
    <div class="header-right">
      <span class="header-brand">The Smart Pig Game</span>
      <div class="header-credits">
        <div>课程设计：<b>罗敏</b> 重庆工商大学</div>
        <div>程序开发：<b>李思惠</b> 重庆工商大学24人资</div>
      </div>
      <button class="dots-btn" id="soundBtn" style="margin-right:6px" aria-label="sound">♪</button>
      <button class="dots-btn" id="dotsBtn" aria-label="menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>
      </button>
    </div>
    <div class="lang-menu" id="langMenu">
      <button class="lang-opt" data-lang="en">English</button>
      <button class="lang-opt" data-lang="both">中英对照</button>
      <div style="border-top:1px solid #f0f0f0;margin:4px 0"></div>
      <button class="layout-opt" data-layout="wide">横版（宽屏）</button>
      <button class="layout-opt" data-layout="narrow">竖版（手机）</button>
      <div style="border-top:1px solid #f0f0f0;margin:4px 0"></div>
      <button class="music-opt" data-music="spring">♪ Spring Bells</button>
      <button class="music-opt" data-music="carnival">♪ Carnival March</button>
      <button class="music-opt" data-music="waltz">♪ Tea Waltz</button>
    </div>
  </header>

  <!-- ===== 白色标签栏 ===== -->
  <nav class="nav-scroll">
    <div class="course-name">财经基础英语</div>
    <div class="nav-pills" id="navTabs"></div>
  </nav>

  <!-- ===== 内容 ===== -->
  <main class="content">
    <!-- 1. Game Intro -->
    <section class="page active" id="page-intro">
      <h1 class="page-title" id="rulesTitle"></h1>
      <details class="rule-model" id="modelBox"><summary><b id="modelb"></b></summary><div class="model-body"><span id="modelt"></span></div></details>
      <div class="rule-tabs" id="ruleTabs">
        <button class="rule-tab active" id="rtab1" data-rule-tab="1"><span class="rt-num">STEP 1</span><span id="rlab1"></span></button>
        <button class="rule-tab" id="rtab2" data-rule-tab="2"><span class="rt-num">STEP 2</span><span id="rlab2"></span></button>
        <button class="rule-tab" id="rtab3" data-rule-tab="3"><span class="rt-num">STEP 3</span><span id="rlab3"></span></button>
      </div>
      <div class="rule-grid">
      <div class="rule-card rule-panel" data-rule-panel="1"><div class="rule-line"><b id="r1b"></b> <span id="r1t"></span></div>
        <div class="mini-stage" id="ms1">
          <div class="ms-btn"></div>
          <div class="ms-lbl btn-lbl" id="lbl1btn"></div>
          <div class="ms-trough"><div class="ms-food"></div></div>
          <div class="ms-lbl tr-lbl" id="lbl1tr"></div>
          <img class="ms-pig" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-big.png" alt="">
          <img class="ms-pig sm" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-small.png" alt="">
        </div>
        <div class="ms-cap" id="cap1"></div>
        <button class="demo-play" id="play1"></button>
      </div>
      <div class="rule-card rule-panel" data-rule-panel="2" hidden><div class="rule-line"><b id="r2b"></b> <span id="r2t"></span></div>
        <div class="mini-stage" id="ms2">
          <div class="ms-btn"></div>
          <div class="ms-lbl btn-lbl" id="lbl2btn"></div>
          <div class="ms-trough"><div class="ms-food"></div></div>
          <div class="ms-lbl tr-lbl" id="lbl2tr"></div>
          <img class="ms-pig" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-big.png" alt="">
          <img class="ms-pig sm" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-small.png" alt="">
        </div>
        <div class="ms-cap" id="cap2"></div>
        <button class="demo-play" id="play2"></button>
      </div>
      <div class="rule-card rule-panel" data-rule-panel="3" hidden><div class="rule-line"><b id="r3b"></b> <span id="r3t"></span></div>
        <div class="mini-stage" id="ms3">
          <div class="ms-btn"></div>
          <div class="ms-lbl btn-lbl" id="lbl3btn"></div>
          <div class="ms-trough"><div class="ms-food"></div></div>
          <div class="ms-lbl tr-lbl" id="lbl3tr"></div>
          <img class="ms-pig" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-big.png" alt="">
          <img class="ms-pig sm" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-small.png" alt="">
        </div>
        <div class="ms-cap" id="cap3"></div>
        <button class="demo-play" id="play3"></button>
      </div>
      <div class="rule-card task"><b id="taskb"></b> <span id="taskt"></span></div>
      </div><button class="btn-pink" id="btnStart" disabled></button>
      <div id="introToast" role="status" aria-live="polite"></div>
    </section>

    <!-- 2. Fun Game -->
    <section class="page" id="page-game">
      <div class="game-wrap">
      <div class="game-scene">
        <div class="food-dispenser">
          <div class="food-circle" id="foodCircle"></div>
          <div class="food-label" id="foodLabel"></div>
        </div>
        <div class="stage">
          <div class="pig-side" id="sideBig">
            <div class="bubbles">
              <button class="bubble" id="bBigPress">
                <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="9" width="10" height="6" rx="3" fill="#e53935"/></svg>
                <span class="bl"></span>
              </button>
              <button class="bubble" id="bBigStay">
                <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="8" ry="7" fill="#ffd9a0"/><circle cx="9.5" cy="11" r="1.2" fill="#5b3a1e"/><circle cx="14.5" cy="11" r="1.2" fill="#5b3a1e"/></svg>
                <span class="bl"></span>
              </button>
            </div>
            <img class="pig-img" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-big.png" alt="Big Pig">
            <div class="pig-tag" id="bigName"></div>
          </div>
          <div class="trough"><div class="food-pile"></div></div>
          <div class="pig-side small" id="sideSmall">
            <div class="bubbles">
              <button class="bubble" id="bSmPress">
                <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="9" width="10" height="6" rx="3" fill="#e53935"/></svg>
                <span class="bl"></span>
              </button>
              <button class="bubble" id="bSmStay">
                <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="8" ry="7" fill="#ffd9a0"/><circle cx="9.5" cy="11" r="1.2" fill="#5b3a1e"/><circle cx="14.5" cy="11" r="1.2" fill="#5b3a1e"/></svg>
                <span class="bl"></span>
              </button>
            </div>
            <img class="pig-img" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-small.png" alt="Small Pig">
            <div class="pig-tag" id="smallName"></div>
          </div>
        </div>
      </div>
      <p class="hint" id="gameHint"></p>
      <div class="satiety">
        <div class="sat-row">
          <img class="sat-avatar" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-big.png" alt="">
          <div class="sat-track"><div class="sat-fill" id="fillBig"></div></div>
          <span class="sat-num" id="numBig">0/10</span>
        </div>
        <div class="sat-row">
          <img class="sat-avatar" src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-small.png" alt="">
          <div class="sat-track"><div class="sat-fill" id="fillSmall"></div></div>
          <span class="sat-num" id="numSmall">0/10</span>
        </div>
      </div>
      <button class="btn-pink" id="btnComplete"></button>
      </div>
    </section>

    <!-- 3. Explainer -->
    <section class="page" id="page-theory">
      <h1 class="page-title" id="theoryTitle"></h1>
      <div class="theory-grid"><div class="theory-card"><h2 id="tSetupH"></h2><p id="tSetupB"></p></div>
      <div class="theory-card">
        <h2 id="tMatrixH"></h2>
        <table class="matrix">
          <colgroup><col style="width:28%"><col style="width:36%"><col style="width:36%"></colgroup>
          <thead><tr><th></th><th id="thSmPress"></th><th id="thSmStay"></th></tr></thead>
          <tbody>
            <tr><th id="thBigPress"></th><td>(5, 1)</td><td class="hl">(4, 4)</td></tr>
            <tr><th id="thBigStay"></th><td>(9, −1)</td><td>(0, 0)</td></tr>
          </tbody>
        </table>
      </div>
      <div class="theory-card"><h2 id="tReadH"></h2><p id="tReadB"></p></div>
      <div class="theory-card"><h2 id="tOutH"></h2><p id="tOutB"></p></div>
      <div class="theory-card"><h2 id="tBizH"></h2><p id="tBizB"></p></div>
      <div class="theory-card"><h2 id="tVocH"></h2><ul class="vocab" id="vocabList"></ul></div>
      </div><button class="btn-pink" id="btnUnderstood"></button>
    </section>

    <!-- 4. Knowledge Quiz -->
    <section class="page" id="page-quiz">
      <h1 class="page-title" id="quizTitle"></h1>
      <p class="hint" id="quizSub"></p>
      <div class="result-banner" id="resultBanner">
        <div class="score-big" id="scoreBig"></div>
        <div class="score-sub" id="scoreSub"></div>
      </div>
      <div id="quizList"></div>
      <button class="btn-pink" id="btnSubmit"></button>
      <button class="btn-start" id="btnToSim" style="display:none">Start Market Simulation</button>
    </section>
    <!-- ===== 5 Market Challenge ===== -->
    <section class="page" id="page-challenge">
      <h1 class="title" id="chTitle">Pig Market Challenge</h1>
      <div class="rule-card" id="chIntro1"></div>
      <div class="rule-card yellow-bg" id="chIntro2"></div>
      <div class="rule-card" id="chIntro3" style="background:#e3f2fd;border-color:#90caf9"></div>
      <button class="btn-start" id="chStart">Start Challenge</button>

      <div id="chGame" style="display:none">
        <p class="hint" id="chRoundPill"></p>
        <div style="text-align:center;margin:10px 0"><span class="role-badge" id="chRoleBadge"></span></div>
        <div class="rule-card" id="chScenario"></div>
        <div class="ch-params">
          <div class="ch-param"><div class="ch-lbl" id="chLblCost">Press cost</div><div class="ch-val" id="chCostVal"></div></div>
          <div class="ch-param"><div class="ch-lbl" id="chLblFood">Market size</div><div class="ch-val" id="chFoodVal"></div></div>
        </div>
        <div class="ch-choices">
          <button class="ch-choice press" id="chBtnPress">
            <div class="ch-choice-icon">Press</div>
            <div class="ch-choice-sub" id="chTxtPress">Invest (R&amp;D / Marketing)</div>
          </button>
          <button class="ch-choice wait" id="chBtnWait">
            <div class="ch-choice-icon">Wait</div>
            <div class="ch-choice-sub" id="chTxtWait">Free-ride &amp; eat</div>
          </button>
        </div>
        <div class="sat-row"><div class="sat-info"><span class="sat-label" id="chLblYou">You (Big Pig)</span><span class="sat-num" id="chScoreYou">0</span></div></div>
        <div class="sat-row"><div class="sat-info"><span class="sat-label" id="chLblOpp">Rival (Small Pig)</span><span class="sat-num" id="chScoreOpp">0</span></div></div>
        <div class="ch-banner" id="chBanner"><span id="chResultText"></span></div>
        <div id="chPayout" style="display:none">
          <div class="ch-payout">
            <div class="ch-cell"><div class="ch-who" id="chPLblYou">You</div><div class="ch-pts" id="chPVYou">0</div></div>
            <div class="ch-cell"><div class="ch-who" id="chPLblOpp">Rival</div><div class="ch-pts" id="chPVOpp">0</div></div>
          </div>
          <div class="rule-card" id="chEq"></div>
        </div>
        <button class="btn-start" id="chNext" style="display:none">Next Market</button>
        <table class="ch-table">
          <thead><tr><th>#</th><th>Cost</th><th>Food</th><th>You</th><th>Rival</th><th>Eq.</th></tr></thead>
          <tbody id="chHistoryBody"></tbody>
        </table>
      </div>

      <div id="chFinal" style="display:none">
        <div class="ch-final-score" id="chFinalScore">0</div>
        <div class="rule-card" id="chFinalVerdict"></div>
        <button class="btn-start" id="chReplay">Play Again</button>
      </div>
    </section>
  </main>
  <!-- 预载跑步姿势帧（隐藏，同时保证发布链路能识别这些资源） -->
  <div style="display:none">
    <img src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/run-a.png" alt=""><img src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/run-b.png" alt="">
    <img src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/run-c.png" alt=""><img src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/run-d.png" alt="">
  </div>

  <!-- 结算弹窗 -->
  <div class="modal-mask" id="resultModal" hidden>
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div class="modal-nums">
        <div class="modal-num"><div class="n" id="mBig">0</div><div class="l" id="mBigL"></div></div>
        <div class="modal-num"><div class="n" id="mSmall">0</div><div class="l" id="mSmallL"></div></div>
      </div>
      <p class="body" id="modalBody"></p>
      <p class="tip-line" id="modalTip"></p>
      <div class="modal-btns">
        <button class="btn-again" id="btnAgain"></button>
        <button class="btn-end" id="btnEnd"></button>
      </div>
    </div>
  </div>
</div>

var CH_ROUNDS=[{c:2,f:10},{c:1,f:10},{c:3,f:10},{c:2,f:14},{c:4,f:10},{c:2,f:7}];
function chPay(you,opp,c,f){
  var big,small;
  if(you==='press'&&opp==='press'){big=f*0.7-c;small=f*0.3-c;}
  else if(you==='press'&&opp==='wait'){big=f*0.4-c;small=f*0.4;}
  else if(you==='wait'&&opp==='press'){big=f*0.9;small=f*0.1-c;}
  else{big=0;small=0;}
  return {big:Math.round(big*10)/10,small:Math.round(small*10)/10};
}
function chSmallRational(big,c,f){
  var p=(big==='press')?f*0.3-c:f*0.1-c;
  var w=(big==='press')?f*0.4:0;
  return (w>=p)?'wait':'press';
}
function chNash(c,f){
  var pairs=[['press','press'],['press','wait'],['wait','press'],['wait','wait']],out=[];
  pairs.forEach(function(p){
    var pay=chPay(p[0],p[1],c,f);
    var bs=(p[0]==='press')?chPay('wait',p[1],c,f).big:chPay('press',p[1],c,f).big;
    var ss=(p[1]==='press')?chPay(p[0],'wait',c,f).small:chPay(p[0],'press',c,f).small;
    if(bs<=pay.big&&ss<=pay.small) out.push({you:p[0],opp:p[1]});
  });
  return out;
}

  chYou+=pay.big;chOpp+=pay.small;
  var msg=(you==='press'?ct('youPressed'):ct('youWaited'))+' '+(opp==='press'?ct('oppPressed'):ct('oppWaited'));
  $('chResultText').textContent=msg;
  $('chScoreYou').textContent=Math.round(chYou*10)/10;
  $('chScoreOpp').textContent=Math.round(chOpp*10)/10;
  $('chPVYou').textContent=Math.round(pay.big*10)/10;
  $('chPVOpp').textContent=Math.round(pay.small*10)/10;
  var eq=chNash(r.c,r.f),eqText='';
  if(eq.length===0) eqText=LANG==='zh'?'无纯策略均衡.':'No pure equilibrium.';
  else{
    var e=eq[0];
    if(e.you==='press'&&e.opp==='wait') eqText=ct('eqPW');
    else if(e.you==='wait'&&e.opp==='wait') eqText=ct('eqWW');
    else if(e.you==='press'&&e.opp==='press') eqText=ct('eqPP');
    else eqText=ct('eqWP');
  }
  $('chEq').innerHTML='<b>'+ct('eqTitle')+'</b>'+eqText;
  $('chPayout').style.display='block';
  var eqShort=eq.length?((eq[0].you==='press'?'P':'W')+'/'+(eq[0].opp==='press'?'P':'W')):'-';
  var tr=document.createElement('tr');
  tr.innerHTML='<td>'+(chRound+1)+'</td><td>'+r.c+'</td><td>'+r.f+'</td><td>'+(you==='press'?'P':'W')+'</td><td>'+(opp==='press'?'P':'W')+'</td><td>'+eqShort+'</td>';
  $('chHistoryBody').appendChild(tr);
  if(chRound>=CH_ROUNDS.length-1) setTimeout(chShowFinal,1200);
  else { $('chNext').style.display='block'; setTimeout(function(){ $('chNext').scrollIntoView({behavior:'smooth',block:'center'}); },200); }
}

  var v=chYou>=35?ct('verdictGood'):(chYou>=25?ct('verdictMid'):ct('verdictBad'));

function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

function sceneCenter(el){
  var s = document.querySelector('.game-scene').getBoundingClientRect();
  var r = el.getBoundingClientRect();
  return { cx: r.left - s.left + r.width/2, cy: r.top - s.top + r.height/2, w: r.width, h: r.height };
}

function anchorPig(side){
  var img = side.querySelector('.pig-img');
  var c = sceneCenter(img);
  img.style.position = 'absolute';
  img.style.zIndex = 10;
  img.style.pointerEvents = 'none';
  img.style.width = c.w + 'px';
  img.style.height = c.h + 'px';
  img.style.left = (c.cx - c.w/2) + 'px';
  img.style.top  = (c.cy - c.h/2) + 'px';
  return img;
}
function movePig(side, to, dur, running){
  return new Promise(function(resolve){
    var img = side.querySelector('.pig-img');
    img.style.transition = 'left ' + dur + 'ms ease-in-out, top ' + dur + 'ms ease-in-out';
    img.style.left = (to.cx - img.offsetWidth/2) + 'px';
    img.style.top  = (to.cy - img.offsetHeight/2) + 'px';
    var frames = side.classList.contains('small') ? FRAMES.small : FRAMES.big;
    var iv = null;
    if(running && !reduceMotion){
      var fi = 0, bob = 0;
      iv = setInterval(function(){
        fi = 1 - fi;
        img.src = frames[fi+1];
        img.style.transform = 'translateY(' + (bob ? -5 : 0) + 'px)';
        bob = 1 - bob;
      }, 140);
    }
    setTimeout(function(){
      if(iv) clearInterval(iv);
      img.src = frames[0];
      img.style.transform = '';
      resolve();
    }, dur);
  });
}
function pressButton(){
  return new Promise(function(resolve){
    var food = $('foodCircle');
    food.style.transform = 'scale(.8)';

async function playSequence(big, small){
  var scene = document.querySelector('.game-scene');
  scene.style.minHeight = scene.offsetHeight + 'px';
  scene.classList.add('play');
  var sideBig = $('sideBig'), sideSmall = $('sideSmall');
  anchorPig(sideBig); anchorPig(sideSmall);
  var btn = sceneCenter($('foodCircle'));
  var tr  = sceneCenter(document.querySelector('.trough'));
  var trBig   = { cx: tr.cx - 30, cy: tr.cy - 48 };
  var trSmall = { cx: tr.cx + 30, cy: tr.cy - 48 };
  await sleep(280);

  if(big==='press' && small==='press'){
    await Promise.all([ movePig(sideBig, {cx:btn.cx-18, cy:btn.cy}, 900, true), movePig(sideSmall, {cx:btn.cx+18, cy:btn.cy}, 900, true) ]);
    await pressButton();
    showBolt(sideBig, '−2', 'minus'); showBolt(sideSmall, '−2', 'minus');
    await sleep(800);
    showFood();
    await sleep(250);
    await Promise.all([ movePig(sideBig, trBig, 850, true), movePig(sideSmall, trSmall, 850, true) ]);
    showBolt(sideBig, '+7', 'plus'); showBolt(sideSmall, '+3', 'plus');
    await sleep(1100);
  } else if(big==='press' && small==='stay'){
    await movePig(sideBig, btn, 900, true);
    await pressButton();
    showBolt(sideBig, '−2', 'minus');
    await sleep(800);
    showFood();
    await sleep(200);
    await movePig(sideSmall, trSmall, 800, true);
    showBolt(sideSmall, '+4', 'plus');
    var bigRun = movePig(sideBig, trBig, 950, true);
    await sleep(500);
    await bigRun;
    showBolt(sideBig, '+6', 'plus');
    await sleep(1000);
  } else { /* big stays, small presses */
    await movePig(sideSmall, btn, 900, true);
    await pressButton();
    showBolt(sideSmall, '−2', 'minus');
    await sleep(800);
    showFood();
    await sleep(200);
    await movePig(sideBig, trBig, 800, true);
    showBolt(sideBig, '+9', 'plus');
    var smallRun = movePig(sideSmall, trSmall, 950, true);
    await sleep(500);
    await smallRun;
    showBolt(sideSmall, '+1', 'plus');
    await sleep(1000);
  }
}

/* ============ 规则三步互动课堂（防跳过门锁） ============ */
var ruleSteps=[false,false,false];
var demoBusy=false;
function rulesDone(){ return ruleSteps[0]&&ruleSteps[1]&&ruleSteps[2]; }
function rulesDoneCount(){ return (ruleSteps[0]?1:0)+(ruleSteps[1]?1:0)+(ruleSteps[2]?1:0); }
function firstIncompleteRule(){ for(var i=0;i<3;i++){ if(!ruleSteps[i]) return i+1; } return 0; }
function showRule(n){
  var tabs=document.querySelectorAll('#ruleTabs .rule-tab');
  for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('active', (i+1)===n); }
  var panels=document.querySelectorAll('.rule-panel');
  for(var j=0;j<panels.length;j++){ panels[j].hidden=(+panels[j].getAttribute('data-rule-panel')!==n); }
  if(n===2) msReset($('ms2'));
  if(n===3) msReset($('ms3'));
}
function updateRuleProgress(){
  var done=rulesDoneCount(), nxt=firstIncompleteRule();
  var tabs=document.querySelectorAll('#ruleTabs .rule-tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('done', ruleSteps[i]);
    tabs[i].classList.toggle('attention', !ruleSteps[i] && (i+1)===nxt);
  }
  var btn=$('btnStart');
  if(rulesDone()){
    btn.disabled=false;
    btn.textContent=t('startBtn');
  }else{
    btn.disabled=true;
    btn.textContent=t('lockBtnFmt').replace('{n}', nxt).replace('{done}', done);
  }
}
function completeRuleStep(n){
  if(ruleSteps[n-1]) return;
  ruleSteps[n-1]=true;
  updateRuleProgress();
  if(n<3){
    showRule(n+1);
    introToast(t('stepDoneFmt').replace('{d}', rulesDoneCount()).replace('{n}', n+1));
  }else{
    introToast(t('allDoneToast'));
  }
}
/* 包装 demo：动画播完才算完成该步；播放中忽略重复点击 */
function runDemo(n, fn){
  return function(){
    if(demoBusy) return;
    demoBusy=true;
    Promise.resolve(fn()).then(function(){
      demoBusy=false;
      completeRuleStep(n);
    });
  };
}
var introToastTimer=null;
function introToast(msg){
  var el=$('introToast');
  el.textContent=msg;
  el.classList.add('show');
  if(introToastTimer) clearTimeout(introToastTimer);
  introToastTimer=setTimeout(function(){ el.classList.remove('show'); }, 2800);
}

function setBar(el, numEl, val){
  numEl.textContent = val + '/10';
  numEl.classList.toggle('neg', val<0);
  el.style.width = Math.max(0, val)/10*100 + '%';
}
function payoff(big, small){
  if(big==='press' && small==='press') return {big:5, small:1, key:'bothPress'};
  if(big==='press' && small==='stay')  return {big:4, small:4, key:'bigPress'};
  if(big==='stay' && small==='press')  return {big:9, small:-1, key:'smallPress'};
  return {big:0, small:0, key:'bothStay'};
}
async function completeSelection(){
  if(state.animating) return;
  state.animating = true;
  /* 手机端：点击提交后自动滚回游戏场景顶部，保证动画全程可见 */
  var cont = document.querySelector('.content');
  var gs = document.querySelector('.game-scene');
  if(cont && gs){
    var gr = gs.getBoundingClientRect();
    var cr = cont.getBoundingClientRect();
    if(gr.top < cr.top - 4 || gr.bottom > cr.bottom + 4){
      var absTop = gr.top - cr.top + cont.scrollTop;
      cont.scrollTo({top: Math.max(0, absTop - 12), behavior:'smooth'});
      await sleep(600);
    }
  }
  var r = payoff(state.bigAction, state.smallAction);
  if(!reduceMotion && !(state.bigAction==='stay' && state.smallAction==='stay')){
    await playSequence(state.bigAction, state.smallAction);
  }
  setBar($('fillBig'), $('numBig'), r.big);
  setBar($('fillSmall'), $('numSmall'), r.small);
  var c = $('foodCircle');
  c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
  $('modalTitle').textContent = t(r.key+'Title');
  $('modalBody').textContent = t(r.key+'Body');
  $('mBig').textContent = r.big;
  $('mSmall').textContent = r.small;
  $('resultModal').hidden = false;
  sfxWin();
  state.animating = false;
}

/* ============ 测验 ============ */
function startQuiz(){
  state.quiz = shuffle(QUESTION_POOL).slice(0,5);
  state.picked = [-1,-1,-1,-1,-1];
  state.submitted = false;
  $('resultBanner').classList.remove('show');
  $('btnSubmit').hidden = false;
  $('btnToSim').style.display='none';
  renderQuiz();
}
function renderQuiz(){
  var letters = ['A','B','C','D'];
  function qtext(q){ return (LANG==='both') ? q.en+' / '+q.zh : q[LANG]; }
  $('quizList').innerHTML = state.quiz.map(function(q, qi){
    var opts = (LANG==='both') ? q.opts.en.map(function(e,i){ return e+' / '+q.opts.zh[i]; }) : q.opts[LANG];
    var rows = opts.map(function(o, oi){
      var cls = 'quiz-opt';
      if(state.submitted){
        cls += ' disabled';
        if(oi===q.a) cls += ' correct';
        else if(oi===state.picked[qi]) cls += ' wrong';
      } else if(oi===state.picked[qi]) cls += ' selected';
      return '<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'"'+(state.submitted?' disabled':'')+'><span class="opt-letter">'+letters[oi]+'</span>'+o+'</button>';
    }).join('');
    return '<div class="quiz-q"><div class="q-stem">Q'+(qi+1)+'. '+qtext(q.q)+'</div>'+rows+'</div>';
  }).join('');
}
function submitQuiz(){
  if(state.submitted) return;
  state.submitted = true;
  var score = 0;
  state.quiz.forEach(function(q, i){ if(state.picked[i]===q.a) score++; });
  var total = state.quiz.length;
  var pct = Math.round(score/total*100);
  $('scoreBig').textContent = fmt(t('resultBig'), {score:score, total:total});
  $('scoreSub').textContent = fmt(t('resultSub'), {pct:pct}) + ' · ' + t('reviewNote');
  $('resultBanner').classList.add('show');
  $('btnSubmit').hidden = true;
  $('btnToSim').style.display='block';
  renderQuiz();
  $('resultBanner').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ============ 页面切换 ============ */
function goPage(p){
  /* 防跳过门禁：三步规则未完成时，禁止离开规则页 */
  if(p!=='intro' && !rulesDone()){
    introToast(t('toastLocked').replace('{done}', rulesDoneCount()));
    return;
  }
  currentPage = p;
  ['intro','game','theory','quiz','challenge'].forEach(function(pg){
    var el = $('page-'+pg);
    if(el) el.classList.toggle('active', pg===p);
  });
  if(p==='quiz') startQuiz();
  if(p==='challenge' && typeof chRenderStatic==='function') chRenderStatic();
  renderStatic();
  var cEl=document.querySelector('.content');
  if(cEl) cEl.scrollTop=0;
}

/* ============ 事件绑定 ============ */
function bind(){
  $('navTabs').addEventListener('click', function(e){
    var b = e.target.closest('.nav-tab');
    if(b) goPage(b.getAttribute('data-page'));
  });
  /* 鼠标按住左右拖动也能滑（桌面端横向滚动条不可见） */
  (function(){
    var box = $('navTabs'), down=false, sx=0, sl=0, moved=false;
    box.addEventListener('pointerdown', function(e){
      down=true; moved=false; sx=e.clientX; sl=box.scrollLeft;
      box.classList.add('dragging');
    });
    window.addEventListener('pointermove', function(e){
      if(!down) return;
      var dx = e.clientX - sx;
      if(Math.abs(dx)>4) moved=true;
      box.scrollLeft = sl - dx;
    });
    window.addEventListener('pointerup', function(){ down=false; box.classList.remove('dragging'); });
    box.addEventListener('click', function(e){
      if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; }
    }, true);
  })();
  /* 规则步骤 tab：点击切换 + 左右滑动切换（仅规则页内） */
  $('ruleTabs').addEventListener('click', function(e){
    var b = e.target.closest('.rule-tab');
    if(b) showRule(+b.getAttribute('data-rule-tab'));
  });
  (function(){
    var box=$('page-intro'), sx=0, sy=0;
    box.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
    box.addEventListener('touchend', function(e){
      var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)){
        var cur=+(document.querySelector('#ruleTabs .rule-tab.active').getAttribute('data-rule-tab')||'1');
        var nx=cur+(dx<0?1:-1);
        if(nx>=1 && nx<=3) showRule(nx);
      }
    }, {passive:true});
  })();
  $('btnStart').addEventListener('click', function(){ if(!$('btnStart').disabled) goPage('game'); });
  $('play1').addEventListener('click', runDemo(1, demo1));
  $('play2').addEventListener('click', runDemo(2, demo2));
  $('play3').addEventListener('click', runDemo(3, demo3));
  $('bBigPress').addEventListener('click', function(){ state.bigAction='press'; renderChoices(); });
  $('bBigStay').addEventListener('click', function(){ state.bigAction='stay'; renderChoices(); });
  $('bSmPress').addEventListener('click', function(){ state.smallAction='press'; renderChoices(); });
  $('bSmStay').addEventListener('click', function(){ state.smallAction='stay'; renderChoices(); });
  $('btnComplete').addEventListener('click', completeSelection);
  $('btnAgain').addEventListener('click', function(){ $('resultModal').hidden=true; resetBars(); });
  $('btnEnd').addEventListener('click', function(){ $('resultModal').hidden=true; goPage('theory'); });
  $('btnUnderstood').addEventListener('click', function(){ goPage('quiz'); });
  $('btnToSim').addEventListener('click', function(){ goPage('challenge'); });
  $('btnSubmit').addEventListener('click', submitQuiz);
  $('quizList').addEventListener('click', function(e){
    var b = e.target.closest('.quiz-opt');
    if(!b || state.submitted) return;
    var qi = +b.getAttribute('data-q'), oi = +b.getAttribute('data-o');
    state.picked[qi] = oi;
    renderQuiz();
  });
  var sb = document.getElementById('soundBtn');
  if(sb) sb.onclick = function(e){
    e.stopPropagation();
    toggleSound();
  };
  $('dotsBtn').onclick = function(e){
    e.stopPropagation();
    var m = $('langMenu');
    if(m.classList.contains('open')){ m.classList.remove('open'); }
    else { m.classList.add('open'); }
  };
  document.addEventListener('click', function(e){
    if(!e.target.closest('.lang-menu') && e.target.id !== 'dotsBtn' && !e.target.closest('#dotsBtn')){
      $('langMenu').classList.remove('open');
    }
  });
  var opts = document.querySelectorAll('.lang-opt');
  for(var i=0;i<opts.length;i++){
    (function(b){
      b.onclick = function(e){
        e.stopPropagation();
        LANG = b.getAttribute('data-lang');
        $('langMenu').classList.remove('open');
        renderStatic();
        if(currentPage==='quiz') renderQuiz();
        if(currentPage==='challenge') chRenderStatic();
      };
    })(opts[i]);
  }
  var mopts = document.querySelectorAll('.music-opt');
  for(var mi=0;mi<mopts.length;mi++){
    (function(b){
      b.onclick = function(e){
        e.stopPropagation();
        switchBGM(b.getAttribute('data-music'));
        $('langMenu').classList.remove('open');
      };
    })(mopts[mi]);
  }
  var lopts = document.querySelectorAll('.layout-opt');
  for(var i=0;i<lopts.length;i++){
    (function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var mode = b.getAttribute('data-layout');
        if(mode==='narrow') document.documentElement.classList.add('narrow');
        else document.documentElement.classList.remove('narrow');
        $('langMenu').classList.remove('open');
      };
    })(lopts[i]);
  }
  $('resultModal').addEventListener('click', function(e){
    if(e.target === $('resultModal')) $('resultModal').hidden = true;
  });
}


/* ============ 音效系统（音乐盒风格） ============ */
var AC = window.AudioContext || window.webkitAudioContext;
var audioCtx = null;
var soundOn = true;
var bgmTimer = null;
var bgmStep = 0;
function ac(){ if(!audioCtx && AC) audioCtx = new AC(); if(soundOn && audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function pluck(freq, dur, vol, when){
  var ctx=ac(); if(!ctx||!soundOn) return;
  var t=ctx.currentTime+(when||0);
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o.frequency.value=freq;
  var o2=ctx.createOscillator(), g2=ctx.createGain();
  o2.type='sine'; o2.frequency.value=freq*2;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.1,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  g2.gain.setValueAtTime(0,t);
  g2.gain.linearRampToValueAtTime((vol||0.1)*0.3,t+0.01);
  g2.gain.exponentialRampToValueAtTime(0.001,t+dur*0.6);
  o.connect(g); g.connect(ctx.destination);
  o2.connect(g2); g2.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.05);
  o2.start(t); o2.stop(t+dur+0.05);
}
function sfxPress(){ pluck(880,0.2,0.12); pluck(1174,0.25,0.1,0.08); }

function sfxWin(){ [523,659,784].forEach(function(f,i){ pluck(f,0.6,0.08,i*0.15); }); pluck(1047,0.9,0.07,0.45); }

var BGM_FILES = {
  spring: 'https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/bgm-spring.wav',
  carnival: 'https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/bgm-carnival.wav',
  waltz: 'https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/bgm-waltz.wav'
};
var bgmAudio = document.getElementById('bgmAudio');
if(bgmAudio){ bgmAudio.loop = true; bgmAudio.volume = 0.5; }
var bgmStyle = 'spring';
function startBGM(){
  if(!bgmAudio) return;
  bgmAudio.src = BGM_FILES[bgmStyle];
  if(soundOn){ bgmAudio.play().catch(function(){}); }
}
function switchBGM(style){
  bgmStyle = style;
  if(!bgmAudio) return;
  bgmAudio.src = BGM_FILES[style];
  if(soundOn){ bgmAudio.play().catch(function(){}); }
}
function toggleSound(){
  soundOn=!soundOn;
  var b=document.getElementById('soundBtn');
  if(b) b.textContent = soundOn ? '♪' : '✕';
  if(bgmAudio){ bgmAudio.muted = !soundOn; if(soundOn) bgmAudio.play().catch(function(){}); }
  if(soundOn){
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  } else {
    if(audioCtx && audioCtx.state==='running') audioCtx.suspend();
  }
  try{ introToast(soundOn ? 'Sound On' : 'Sound Off'); }catch(e){}
}

/* ============ 启动 ============ */
renderStatic();
bind();
document.body.addEventListener('pointerdown', function once(){ startBGM(); document.body.removeEventListener('pointerdown', once); }, {once:true});
setTimeout(function(){ if(currentPage==='intro') demo1(); }, 900);
})();

</script>
