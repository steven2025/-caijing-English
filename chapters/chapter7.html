<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第七章 · GDP 与经济周期 GDP & Business Cycle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2360a5fa'/%3E%3Cpath d='M22 78 h56 M30 74 v-18 h10 v18 M44 74 v-34 h10 v34 M58 74 v-24 h10 v24' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --c7:#60a5fa;--c7-2:#2563eb;--c7-bg:#eff6ff;
  --ink:#1e293b;--sub:#64748b;
  --line:#dbeafe;
  --b1:#60a5fa;--b2:#f59e0b;
  --shadow:0 12px 28px -10px rgba(37,99,235,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(900px 500px at 85% -10%,rgba(96,165,250,.15),transparent 60%),
             radial-gradient(700px 420px at -8% 25%,rgba(245,158,11,.09),transparent 55%),
             linear-gradient(165deg,#f5f9ff,#eef4fc 45%,#e9f1fa);
  color:var(--ink);
  font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{font-family:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- 顶部 ---------- */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand .no{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--c7-2)}
.brand .cn{font-size:19px;font-weight:900;color:var(--ink)}
.brand .cn small{font-size:12.5px;font-weight:700;color:var(--sub);margin-left:8px;letter-spacing:.4px}
#backBtn{
  margin-left:auto;display:none;align-items:center;gap:6px;
  border:1.5px solid var(--c7);background:#fff;color:var(--c7-2);
  padding:8px 16px;border-radius:20px;font-size:14px;font-weight:800;
  transition:.2s;
}
#backBtn.show{display:inline-flex}
#backBtn:hover{background:var(--c7);color:#fff;transform:translateY(-1px)}
#backBtn svg{width:15px;height:15px}

/* ---------- 双卡主区 ---------- */
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
main.hidden{display:none}
.hub-title{text-align:center;margin-bottom:26px}
.hub-title .t1{font-size:26px;font-weight:900;color:var(--ink)}
.hub-title .t2{font-size:14px;color:var(--sub);margin-top:5px;letter-spacing:.5px}
.hub-title .bar{width:64px;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,var(--c7),var(--b2))}
.grid{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}

.card{
  flex:1 1 280px;max-width:360px;min-height:320px;
  background:#fff;border-radius:24px;border:1.5px solid var(--line);
  padding:28px 24px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;
  box-shadow:0 10px 30px -14px rgba(40,60,100,.18);
  position:relative;overflow:hidden;
  transition:transform .22s,box-shadow .25s;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:6px;
  background:linear-gradient(90deg,var(--cc),var(--cc2));
}
.card .icon{
  width:120px;height:120px;border-radius:28px;margin:14px 0 16px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:color-mix(in srgb,var(--cc) 12%,#fff);
  border:1.5px solid color-mix(in srgb,var(--cc) 34%,#fff);
}
.card .icon svg{width:58px;height:58px;fill:none;stroke:var(--cc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card .cn{font-size:21px;font-weight:900;color:var(--ink)}
.card .en{font-size:13.5px;font-weight:700;color:var(--sub);margin-top:4px;letter-spacing:.3px}
.card .tag{
  margin-top:14px;padding:7px 18px;border-radius:18px;
  font-size:13px;font-weight:800;color:var(--cc);
  background:color-mix(in srgb,var(--cc) 12%,#fff);
  border:1.5px solid color-mix(in srgb,var(--cc) 30%,#fff);
}
.card.go{cursor:pointer}
.card.go:hover{transform:translateY(-6px);box-shadow:0 20px 44px -16px rgba(37,99,235,.38)}
.card.go .tag{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- 游戏 iframe ---------- */
#gameFrame{
  flex:1;width:100%;border:none;display:none;background:#e8eef7;
}
#gameFrame.show{display:block}

/* 移动端 */
@media (max-width:760px){
  .grid{flex-direction:column;align-items:center}
  .card{max-width:420px;min-height:260px}
  .hub-title .t1{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="no">CHAPTER 07</span>
      <span class="cn">GDP 与经济周期 <small>GDP & Business Cycle</small></span>
    </div>
    <button id="backBtn" onclick="backToHub()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      返回 Return
    </button>
  </header>

  <main id="hub">
    <div class="hub-title">
      <div class="t1">选择互动 · Choose an Activity</div>
      <div class="t2">两个主题探索宏观表现 · Two topics to explore the macroeconomy</div>
      <div class="bar"></div>
    </div>
    <div class="grid">
      <div class="card go" style="--cc:var(--b1);--cc2:#93c5fd" onclick="openGame('chapter7-gdp.html')">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M3 20h18M5 20v-8h4v8M10.5 20V5h4v15M16 20v-6h4v6"/></svg>
        </div>
        <div class="cn">GDP 与经济周期</div>
        <div class="en">GDP & Business Cycle</div>
        <div class="tag">开始 · Start</div>
      </div>
      <div class="card go" style="--cc:var(--b2);--cc2:#fbbf24" onclick="openGame('chapter7-inflation.html')">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M4 18c3-7 5-7 8-1s5 6 8-1"/><path d="M20 5v6h-6"/></svg>
        </div>
        <div class="cn">通胀与购买力</div>
        <div class="en">Inflation & Purchasing Power</div>
        <div class="tag">开始 · Start</div>
      </div>
    </div>
  </main>

  <iframe id="gameFrame" title="Activity"></iframe>
</div>

<script>
var frame=document.getElementById('gameFrame');
var hub=document.getElementById('hub');
var backBtn=document.getElementById('backBtn');
function openGame(src){
  hub.classList.add('hidden');
  frame.src=src;
  frame.classList.add('show');
  backBtn.classList.add('show');
  document.title='第七章 · '+src.replace('.html','');
}
function backToHub(){
  frame.removeAttribute('src');
  frame.classList.remove('show');
  hub.classList.remove('hidden');
  backBtn.classList.remove('show');
  document.title='第七章 · GDP 与经济周期 GDP & Business Cycle';
}
</script>
</body>
</html>
