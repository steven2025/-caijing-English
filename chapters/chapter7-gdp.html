function bindCountryPicker(id,max,onChange,single=false){
  const wrap=document.getElementById(id);if(!wrap)return;
  const btn=wrap.querySelector('.moduleCountryToggle');
  const warn=wrap.querySelector('.moduleCountryWarn');
  btn.onclick=e=>{e.stopPropagation();wrap.classList.toggle('open');};
  wrap.querySelectorAll('input').forEach(input=>{
    input.onchange=e=>{
      let values=Array.from(wrap.querySelectorAll('input:checked')).map(x=>x.value);
      if(single){
        if(e.target.checked){values=[e.target.value];wrap.querySelectorAll('input').forEach(x=>x.checked=x.value===e.target.value);}
        if(values.length===0){e.target.checked=true;values=[e.target.value];}
      }else{
        if(values.length>max){e.target.checked=false;warn.style.display='block';setTimeout(()=>warn.style.display='none',2200);return;}

    };
  });
}

      name:c,type:'bar',data:getSeries(c,'gdp'),barMaxWidth:bw,barGap:selected.length>1?'18%':'30%',barCategoryGap:selected.length>1?'55%':'45%',large:true,largeThreshold:100,
      label:{show:false,position:'top',fontSize:10,formatter:p=>fmt(p.value,1)},
      emphasis:{focus:'series',label:{show:true,position:'top',fontSize:11,formatter:p=>fmt(p.value,1)+' 亿美元'}},
      itemStyle:{borderRadius:[3,3,0,0]}
    }))
  });
  chart.off('click');
  chart.on('click', params=>{if(params.componentType==='series'){chart.dispatchAction({type:'showTip',seriesIndex:params.seriesIndex,dataIndex:params.dataIndex});}});
  el.insertAdjacentHTML('beforeend',countryPickerHTML('barCountryPicker',selected,3,false));
  bindCountryPicker('barCountryPicker',3,vals=>{barSelected=vals;render();},false);
  addDownloadButton(el,chart,'GDP柱状图_'+selected.join('_'));
}
function renderGrowth(){
  const selected=growthSelected;
  document.getElementById('viewTitle').textContent='GDP增速曲线图';
  document.getElementById('viewSub').textContent='GDP Growth，单位：%；多国用不同颜色线条区分。';
  const el=document.getElementById('content');
  chart=echarts.init(el);
  const ys=years();
  chart.setOption({color:palette,tooltip:{trigger:'axis',valueFormatter:v=>fmt(v,2)+'%'},legend:{top:48,data:selected},grid:{top:92,left:72,right:110,bottom:68},dataZoom:[{type:'inside'},{type:'slider',height:22,bottom:22}],xAxis:{type:'category',data:ys,axisLabel:{interval:4}},yAxis:{type:'value',name:'GDP Growth（%）',axisLabel:{formatter:'{value}%'}},series:selected.map((c,i)=>({name:c,type:'line',smooth:true,showSymbol:false,symbolSize:5,lineStyle:{width:3},emphasis:{focus:'series'},data:getSeries(c,'growth')}))});
  el.insertAdjacentHTML('beforeend',countryPickerHTML('growthCountryPicker',selected,3,false));
  bindCountryPicker('growthCountryPicker',3,vals=>{growthSelected=vals;render();},false);
  addDownloadButton(el,chart,'GDP增速曲线图_'+selected.join('_'));
}
function renderCycle(){
  document.getElementById('viewTitle').textContent='经济周期分析';
  document.getElementById('viewSub').textContent='选择国家与年份区间，自动生成可喂给AI的学习提示词。';
  const el=document.getElementById('content');
  const one=cycleCountry;
  const ys=years();
  el.innerHTML='<div class="definition">The business cycle refers to the phenomenon of periodic alternation between economic expansions and contractions, a cycle of ups and downs in economic activity, including fluctuations in national output, income and employment.</div><div class="formRow"><strong>请选择用于经济周期分析的国家：</strong><div id="cycleCountryHost" style="position:relative;display:inline-block;width:240px;height:42px"></div></div><div class="formRow"><strong>请选择该国一个完整的经济周期区间：</strong><select id="startYear" class="select">'+ys.map(y=>'<option>'+y+'</option>').join('')+'</select><span>到</span><select id="endYear" class="select">'+ys.map(y=>'<option '+(y===2026?'selected':'')+'>'+y+'</option>').join('')+'</select><button class="copyBtn" id="copyPrompt">复制提示词</button></div><div id="miniChart" style="height:340px;width:100%;border:1px solid var(--line);border-radius:18px;margin:16px 0;position:relative"></div><h3>生成提示词</h3><div class="promptBox" id="promptBox"></div>';
  document.getElementById('cycleCountryHost').innerHTML=countryPickerHTML('cycleCountryPicker',[one],1,true);
  const picker=document.getElementById('cycleCountryPicker');picker.style.top='0';picker.style.left='0';picker.style.transform='none';
  const sy=document.getElementById('startYear'), ey=document.getElementById('endYear'), pb=document.getElementById('promptBox');
  function prompt(){const c=cycleCountry,s=sy.value,e=ey.value;pb.textContent='Please help me investigate whether the economy of '+c+' experienced a complete business cycle from '+s+' to '+e+'.\n\n  Keep the entire conclusion within 300 words. Use simple, clear English suitable for Chinese college students.  Use simple, clear English suitable for college students and provide the Chinese equivalent to those expressions which are beyond CET Band 4.';drawMini(c,s,e);updatePills();}
  let mini=null;function drawMini(c,s,e){if(mini)mini.dispose();mini=echarts.init(document.getElementById('miniChart'));mini.setOption({color:[palette[1]],tooltip:{trigger:'axis',valueFormatter:v=>fmt(v,2)+'%'},grid:{top:35,left:60,right:110,bottom:45},xAxis:{type:'category',data:ys,axisLabel:{interval:4}},yAxis:{type:'value',name:'%'},series:[{name:c,type:'line',smooth:true,showSymbol:false,lineStyle:{width:3},markArea:{itemStyle:{opacity:.18},data:[[ {xAxis:s,name:'学生选择区间'}, {xAxis:e} ]]},data:getSeries(c,'growth')} ]});addDownloadButton(document.getElementById('miniChart'),mini,'经济周期分析_'+c+'_'+s+'_'+e);}
  bindCountryPicker('cycleCountryPicker',1,vals=>{cycleCountry=vals[0];prompt();},true);
  sy.onchange=prompt;ey.onchange=prompt;document.getElementById('copyPrompt').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(pb.textContent);prompt();
}
function toggleCountries(){document.getElementById('countrySection').classList.toggle('collapsedBody');}
document.querySelectorAll('.menuBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.menuBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render();});window.addEventListener('resize',()=>{if(chart)chart.resize()});render();
</script>
</body></html>
