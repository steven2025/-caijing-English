<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第五章 · 市场竞争 Market Competition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fb7185'/%3E%3Cpath d='M50 28 L76 44 L50 60 L24 44 Z' fill='%23fff'/%3E%3Cpath d='M34 60 v14 q16 10 32 0 v-14' fill='none' stroke='%23fff' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --c5:#fb7185;--c5-2:#f43f5e;--c5-bg:#fff0f3;
  --ink:#2e2426;--sub:#8a777c;
  --line:#f6dde3;
  --b1:#38bdf8;--b2:#a78bfa;--b3:#fb7185;
  --shadow:0 12px 28px -10px rgba(244,63,94,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(900px 500px at 85% -10%,rgba(251,113,133,.14),transparent 60%),
             radial-gradient(700px 420px at -8% 25%,rgba(167,139,250,.10),transparent 55%),
             linear-gradient(165deg,#fdf6f7,#f8eef1 45%,#f5e9ee);
  color:var(--ink);
  font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{font-family:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- 顶部 ---------- */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand .no{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--c5-2)}
.brand .cn{font-size:19px;font-weight:900;color:var(--ink)}
.brand .cn small{font-size:12.5px;font-weight:700;color:var(--sub);margin-left:8px;letter-spacing:.4px}
#backBtn{
  margin-left:auto;display:none;align-items:center;gap:6px;
  border:1.5px solid var(--c5);background:#fff;color:var(--c5-2);
  padding:8px 16px;border-radius:20px;font-size:14px;font-weight:800;
  transition:.2s;
}
#backBtn.show{display:inline-flex}
#backBtn:hover{background:var(--c5);color:#fff;transform:translateY(-1px)}
#backBtn svg{width:15px;height:15px}

/* ---------- 三卡主区 ---------- */
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
main.hidden{display:none}
.hub-title{text-align:center;margin-bottom:26px}
.hub-title .t1{font-size:26px;font-weight:900;color:var(--ink)}
.hub-title .t2{font-size:14px;color:var(--sub);margin-top:5px;letter-spacing:.5px}
.hub-title .bar{width:64px;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,var(--c5),var(--b2))}
.grid{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1080px}

.card{
  flex:1 1 260px;max-width:320px;min-height:300px;
  background:#fff;border-radius:24px;border:1.5px solid var(--line);
  padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;
  box-shadow:0 10px 30px -14px rgba(60,40,50,.18);
  position:relative;overflow:hidden;
  transition:transform .22s,box-shadow .25s;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:6px;
  background:linear-gradient(90deg,var(--cc),var(--cc2));
}
.card .icon{
  width:112px;height:112px;border-radius:26px;margin:14px 0 16px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:color-mix(in srgb,var(--cc) 12%,#fff);
  border:1.5px solid color-mix(in srgb,var(--cc) 34%,#fff);
}
.card .icon img{width:88%;height:88%;object-fit:contain}
.card .icon svg{width:56px;height:56px;fill:none;stroke:var(--cc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card .cn{font-size:20px;font-weight:900;color:var(--ink)}
.card .en{font-size:13.5px;font-weight:700;color:var(--sub);margin-top:4px;letter-spacing:.3px}
.card .tag{
  margin-top:14px;padding:7px 18px;border-radius:18px;
  font-size:13px;font-weight:800;color:var(--cc);
  background:color-mix(in srgb,var(--cc) 12%,#fff);
  border:1.5px solid color-mix(in srgb,var(--cc) 30%,#fff);
}

.card.go{cursor:pointer;--cc:var(--b3);--cc2:#f472b6}
.card.go:hover{transform:translateY(-6px);box-shadow:0 20px 44px -16px rgba(244,63,94,.4)}
.card.go .tag{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.card.soon{--cc:var(--b1);--cc2:#7dd3fc;cursor:default;filter:saturate(.55) brightness(.99)}
.card.soon:nth-child(2){--cc:var(--b2);--cc2:#c4b5fd}
.card.soon .tag{color:var(--sub);background:#f5f5f5;border-color:#e8e8e8}

/* ---------- 游戏 iframe ---------- */
#gameFrame{
  flex:1;width:100%;border:none;display:none;background:#efe6ea;
}
#gameFrame.show{display:block}

/* 移动端 */
@media (max-width:760px){
  .grid{flex-direction:column;align-items:center}
  .card{max-width:420px;min-height:250px}
  .hub-title .t1{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="no">CHAPTER 05</span>
      <span class="cn">市场竞争 <small>Market Competition</small></span>
    </div>
    <button id="backBtn" onclick="backToHub()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      返回 Return
    </button>
  </header>

  <main id="hub">
    <div class="hub-title">
      <div class="t1">选择游戏 · Choose a Game</div>
      <div class="t2">三种方式体验市场竞争 · Three ways to explore market competition</div>
      <div class="bar"></div>
    </div>
    <div class="grid">
      <div class="card go" style="--cc:var(--b1);--cc2:#7dd3fc" onclick="openGame('chapter5-players.html')">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M3 21h18M4 21V10l8-6 8 6v11M9 21v-6h6v6"/><path d="M9 10a3 3 0 1 0 6 0"/></svg>
        </div>
        <div class="cn">市场主体认知</div>
        <div class="en">Market Players</div>
        <div class="tag">开始 · Start</div>
      </div>
      <div class="card go" style="--cc:var(--b2);--cc2:#c4b5fd" onclick="openGame('chapter5-prisoner.html')">
        <div class="icon">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><circle cx="16" cy="9" r="4"/><path d="M8 13v3a4 4 0 0 0 8 0v-3M8 16h8M6 21v-2a2 2 0 0 1 2-2M18 21v-2a2 2 0 0 0-2-2"/></svg>
        </div>
        <div class="cn">囚徒困境</div>
        <div class="en">Prisoner's Dilemma</div>
        <div class="tag">开始 · Start</div>
      </div>
      <div class="card go" onclick="openGame('chapter5-pigs.html')">
        <div class="icon">
          <img src="https://caijing-english-1311686407.cos.ap-guangzhou.myqcloud.com/chapter5/pigs/pig-big.png" alt="Boxed Pigs">
        </div>
        <div class="cn">智猪博弈</div>
        <div class="en">Boxed Pigs</div>
        <div class="tag">开始 · Start</div>
      </div>
    </div>
  </main>

  <iframe id="gameFrame" title="Game"></iframe>
</div>

<script>
var frame=document.getElementById('gameFrame');
var hub=document.getElementById('hub');
var backBtn=document.getElementById('backBtn');
function openGame(src){
  hub.classList.add('hidden');
  frame.src=src;
  frame.classList.add('show');
  backBtn.classList.add('show');
  document.title='第五章 · '+src.replace('.html','');
}
function backToHub(){
  frame.removeAttribute('src');
  frame.classList.remove('show');
  hub.classList.remove('hidden');
  backBtn.classList.remove('show');
  document.title='第五章 · 市场竞争 Market Competition';
}
</script>
</body>
</html>
