<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15331f"/>
      <stop offset="1" stop-color="#08130e"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#f29a2e"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0a8"/>
      <stop offset="1" stop-color="#3dbb7d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#d4af37" stroke-opacity=".35" stroke-width="6"/>

  <!-- 卡通坐标轴 -->
  <g stroke="#f5eeda" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M142 308 L142 122"/>
    <path d="M142 308 L380 308"/>
  </g>
  <g stroke="#f5eeda" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M142 108 l-13 26 M142 108 l13 26"/>
    <path d="M394 308 l-26 -13 M394 308 l-26 13"/>
  </g>
  <text x="142" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#f5eeda">P</text>
  <text x="416" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#f5eeda">Q</text>

  <!-- D 需求曲线（橙金，左上→右下） -->
  <path d="M172 158 C 236 214, 288 256, 358 286" fill="none" stroke="url(#d)" stroke-width="26" stroke-linecap="round"/>
  <text x="356" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#ffc46b">D</text>

  <!-- S 供给曲线（翠绿，左下→右上） -->
  <path d="M172 296 C 240 264, 300 216, 358 160" fill="none" stroke="url(#s)" stroke-width="26" stroke-linecap="round"/>
  <text x="356" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#7fe0a8">S</text>

  <!-- 均衡点 E -->
  <circle cx="267" cy="227" r="26" fill="#f5e3a0" stroke="#8a6f1e" stroke-width="9"/>
  <circle cx="267" cy="227" r="9" fill="#8a6f1e"/>
</svg>
