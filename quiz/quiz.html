<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试中心 · Quiz Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d1f18'/%3E%3Cpath d='M50 22 L84 40 L50 58 L16 40 Z' fill='%23d4af37'/%3E%3C/svg%3E">
<style>
:root{
  --bg0:#070f0c;--bg1:#0b1712;--bg2:#101f18;
  --gold:#d4af37;--gold2:#e8c56a;--gold3:#f8e7a8;
  --ink:#f5eeda;--sub:#b9cbbe;--dim:#6f8876;
  --line:rgba(212,175,55,.16);
  --ok:#3ddc97;--no:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 82% -10%,rgba(212,175,55,.14),transparent 60%),
             radial-gradient(1000px 600px at -10% 30%,rgba(56,189,248,.08),transparent 55%),
             linear-gradient(160deg,var(--bg0),var(--bg1) 45%,var(--bg2));
  color:var(--ink);font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%,rgba(232,197,106,.5),transparent 60%),
    radial-gradient(1px 1px at 78% 12%,rgba(232,197,106,.4),transparent 60%),
    radial-gradient(1.6px 1.6px at 35% 68%,rgba(232,197,106,.35),transparent 60%),
    radial-gradient(1px 1px at 92% 55%,rgba(232,197,106,.4),transparent 60%),
    radial-gradient(1.3px 1.3px at 55% 88%,rgba(232,197,106,.3),transparent 60%);}
button{font-family:inherit;cursor:pointer}
main{position:relative;z-index:1}

/* ---------- 顶栏 ---------- */
.topbar{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:16px;padding:0 22px;
  background:rgba(6,14,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:2;}
.topbar .t{font-size:17px;font-weight:900;color:var(--gold2);letter-spacing:1px;white-space:nowrap;font-family:Georgia,"Songti SC",serif;}
.topbar .t small{color:var(--sub);font-weight:600;margin-left:10px;font-family:sans-serif;letter-spacing:0}
.topbar .spacer{flex:1}
.back-home{border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:7px 15px;border-radius:11px;font-size:13px;font-weight:800;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s,box-shadow .2s,background .2s;}
.back-home:hover{background:rgba(212,175,55,.14);transform:translateY(-1px)}
.back-home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#timer{display:none;align-items:center;gap:8px;padding:7px 18px;border-radius:30px;font-size:15px;font-weight:900;letter-spacing:1px;color:var(--gold3);
  border:1.5px solid rgba(212,175,55,.5);background:rgba(212,175,55,.08);}
#timer.warn{color:#fff;border-color:var(--no);background:rgba(251,113,133,.16);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}

/* ---------- 视图 ---------- */
.view{display:none;max-width:920px;margin:0 auto;padding:22px 20px 60px;width:100%}
.view.show{display:block}
.sub{color:var(--sub);font-size:13px;margin-top:6px}

/* ---------- 选章 ---------- */
.pick-head{text-align:center;margin-bottom:24px}
.pick-head .t1{font-size:26px;font-weight:900}
.pick-head .t1 b{color:var(--gold2);font-family:Georgia,"Songti SC",serif}
.pick-head .t2{font-size:13.5px;color:var(--sub);margin-top:6px}
.pick-head .bar{width:64px;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.ch-grid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.ch-card{flex:1 1 200px;max-width:232px;min-height:148px;border-radius:20px;cursor:pointer;background:rgba(10,23,17,.82);
  border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px 14px;
  box-shadow:0 8px 22px -10px rgba(0,0,0,.6);transition:transform .15s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.ch-card::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s;
  background:radial-gradient(160px 80px at 50% 50%,rgba(255,255,255,.1),transparent 70%)}
.ch-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 30px -12px rgba(212,175,55,.4)}
.ch-card:hover::after{opacity:1}
.ch-card .no{font-size:15px;font-weight:900;color:var(--gold2);letter-spacing:2px}
.ch-card .cn{font-size:17px;font-weight:900}
.ch-card .en{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.4}
.ch-card .meta{font-size:11px;color:var(--dim);margin-top:2px}
.ch-card.lock{opacity:.5;cursor:not-allowed;filter:saturate(.55)}
.ch-card.lock:hover{transform:none;border-color:var(--line);box-shadow:0 8px 22px -10px rgba(0,0,0,.6)}
.ch-card.lock::after{opacity:0}
.ch-card.lock .no{color:var(--dim)}
.ch-card.lock .tag-lock{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-top:2px}
.preview-bar{max-width:820px;margin:0 auto 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(212,175,55,.10);border:1.5px solid rgba(212,175,55,.45);border-radius:14px;padding:12px 18px;font-size:13.5px;color:var(--gold2);line-height:1.6}
.preview-bar b{font-weight:900}
.preview-bar .x{margin-left:auto;cursor:pointer;border:0;background:none;color:var(--gold2);font-size:16px;font-weight:900}

/* ---------- 等待页 ---------- */
.wait-box{max-width:520px;margin:90px auto 0;text-align:center;background:rgba(10,23,17,.82);
  border:1.5px solid var(--line);border-radius:24px;padding:44px 34px}
.wait-box .ic{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(212,175,55,.5);background:rgba(212,175,55,.08)}
.wait-box .ic svg{width:36px;height:36px;stroke:var(--gold2)}
.wait-box h2{font-size:21px;font-weight:900;color:var(--gold2);margin-bottom:10px}
.wait-box p{font-size:14.5px;color:var(--sub);line-height:1.8}
.wait-box .hint{font-size:12px;color:var(--dim);margin-top:14px}

/* ---------- 做题（一题一页） ---------- */
.qz-wrap{max-width:820px;margin:0 auto}
.qz-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qz-head .sec{font-size:19px;font-weight:900;color:var(--gold2)}
.qz-head .sec small{font-size:12px;color:var(--sub);font-weight:600;margin-left:8px}
.qz-head .quit{margin-left:auto;border:1.5px solid var(--line);background:rgba(255,255,255,.03);color:var(--sub);
  padding:7px 16px;border-radius:11px;font-size:13px;font-weight:700}
.qz-head .quit:hover{color:var(--no);border-color:var(--no)}
/* 题号索引条 */
.idx-bar{display:flex;gap:9px;flex-wrap:wrap;background:rgba(10,23,17,.75);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:16px}
.idx-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:var(--dim);background:rgba(255,255,255,.03);border:1.5px solid rgba(212,175,55,.18);cursor:pointer;transition:all .15s}
.idx-dot:hover{border-color:var(--gold2);color:var(--gold2)}
.idx-dot.done{color:#241d05;background:linear-gradient(140deg,var(--gold3),var(--gold));border-color:transparent}
.idx-dot.cur{border-color:var(--gold2);color:var(--gold2);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
/* 题目卡片 */
.q-card{background:rgba(10,23,17,.82);border:1.5px solid var(--line);border-radius:22px;padding:34px 40px 30px;min-height:330px;
  display:flex;flex-direction:column}
.q-card .q-no{font-size:13px;font-weight:900;color:var(--dim);letter-spacing:2px;margin-bottom:10px}
.q-card .q-type{display:inline-block;font-size:12px;font-weight:800;padding:3px 14px;border-radius:20px;margin-bottom:16px;align-self:flex-start;
  background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.35)}
.q-card .q-type.mc{background:rgba(212,175,55,.12);color:var(--gold2);border-color:rgba(212,175,55,.4)}
.q-card .stem{font-size:21px;line-height:1.75;font-weight:700;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid rgba(212,175,55,.24);
  background:rgba(255,255,255,.03);color:var(--ink);border-radius:14px;padding:15px 18px;font-size:18px;line-height:1.55;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--gold2)}
.opt .k{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
  color:var(--gold2);border:1.5px solid rgba(212,175,55,.4);background:rgba(212,175,55,.08)}
.opt.sel{border-color:var(--gold);background:rgba(212,175,55,.16)}
.opt.sel .k{background:linear-gradient(140deg,var(--gold3),var(--gold));color:#241d05}
/* 翻译 */
.t-area .stem{margin-bottom:18px}
.t-area textarea{width:100%;min-height:150px;resize:vertical;border-radius:14px;padding:16px 18px;font-size:18px;line-height:1.7;
  background:rgba(255,255,255,.05);border:2px solid rgba(212,175,55,.28);color:var(--ink);font-family:inherit;flex:1}
.t-area textarea:focus{outline:none;border-color:var(--gold)}
/* 底部导航 */
.q-nav{display:flex;align-items:center;gap:14px;margin-top:18px}
.q-nav .btn-prev,.q-nav .btn-next{flex:1;border:0;border-radius:40px;padding:14px 20px;font-size:16px;font-weight:900;color:#241d05;
  background:linear-gradient(120deg,#fdf3cf,var(--gold) 45%,var(--gold2) 80%,#fdf3cf);background-size:220% auto;
  box-shadow:0 5px 0 #8a6f1e;transition:transform .15s,box-shadow .2s}
.q-nav .btn-prev:hover,.q-nav .btn-next:hover{transform:translateY(-2px);box-shadow:0 7px 0 #8a6f1e}
.q-nav .btn-prev:active,.q-nav .btn-next:active{transform:translateY(1px);box-shadow:0 2px 0 #8a6f1e}
.q-nav .btn-prev:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 #8a6f1e}
.q-nav .btn-prev{background:transparent;color:var(--gold2);border:1.5px solid var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.q-nav .btn-prev:hover{background:rgba(212,175,55,.12);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.q-nav .mid{font-size:13px;color:var(--dim);font-weight:700;white-space:nowrap}
.q-nav .mid b{color:var(--gold2);font-size:15px}

/* ---------- 已提交等待 ---------- */
.sub-box{max-width:560px;margin:80px auto 0;text-align:center;background:rgba(10,23,17,.85);
  border:1.5px solid var(--gold);border-radius:24px;padding:44px 34px}
.sub-box .ic{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(61,220,151,.12);border:2px solid rgba(61,220,151,.5)}
.sub-box .ic svg{width:34px;height:34px;stroke:var(--ok)}
.sub-box h2{font-size:21px;font-weight:900;color:var(--ok);margin-bottom:10px}
.sub-box p{font-size:14.5px;color:var(--sub);line-height:1.9}
.sub-box .hint{font-size:12.5px;color:var(--dim);margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}

/* ---------- 结果 ---------- */
.score-hero{display:flex;align-items:center;gap:26px;background:rgba(10,23,17,.82);border:1.5px solid var(--line);
  border-radius:24px;padding:26px 30px;margin-bottom:20px;flex-wrap:wrap}
.score-ring{flex:0 0 132px;width:132px;height:132px;position:relative}
.score-ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.score-ring .bg{stroke:rgba(212,175,55,.15)}
.score-ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.score-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .num b{font-size:34px;font-weight:900;color:var(--gold3);font-family:Georgia,serif}
.score-ring .num span{font-size:11px;color:var(--dim)}
.score-info{flex:1;min-width:220px}
.score-info .lvl{font-size:19px;font-weight:900;color:var(--gold2);margin-bottom:6px}
.score-info .line{font-size:13px;color:var(--sub);line-height:1.8}
.score-info .line b{color:var(--ink)}
.r-block{background:rgba(10,23,17,.75);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:20px}
.r-block .r-title{font-size:15.5px;font-weight:900;color:var(--gold3);margin-bottom:12px}
.r-item{padding:14px 0;border-bottom:1px dashed rgba(212,175,55,.14)}
.r-item:last-child{border-bottom:0}
.r-item .q-line{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
.r-item .q-line .mark{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.r-item .ok .mark{background:rgba(61,220,151,.18);color:var(--ok);border:1px solid rgba(61,220,151,.5)}
.r-item .bad .mark{background:rgba(251,113,133,.16);color:var(--no);border:1px solid rgba(251,113,133,.5)}
.r-item .ans{font-size:12.5px;color:var(--sub);margin-top:6px}
.r-item .ans b{color:var(--gold2)}
.r-item .your{font-size:12.5px;color:var(--no);margin-top:3px}
.r-item .your.good{color:var(--ok)}
.r-item .q-line .s2{flex:0 0 34px;font-weight:900;color:var(--gold2);font-size:14px;text-align:right}
.ref{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.7;background:rgba(212,175,55,.06);border-radius:10px;padding:9px 12px}
.ref b{color:var(--gold2);font-weight:800}
.ai-line{font-size:12.5px;color:#7dd3fc;margin-top:7px;background:rgba(56,189,248,.07);border-radius:10px;padding:8px 12px}
.ai-line b{color:#7dd3fc}
.action-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(4,9,7,.72);backdrop-filter:blur(6px);padding:20px}
.modal.show{display:flex}
.modal-card{width:min(540px,94vw);border-radius:20px;background:linear-gradient(170deg,#10241a,#0b1a13);
  border:1px solid rgba(212,175,55,.35);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:26px 28px}
.modal-card h3{font-size:19px;font-weight:900;color:var(--gold2);margin-bottom:10px}
.modal-card p{font-size:14px;color:var(--sub);line-height:1.75;margin-bottom:18px}
.m-btns{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:0;border-radius:40px;padding:11px 34px;font-size:14.5px;font-weight:900;color:#241d05;
  background:linear-gradient(120deg,#fdf3cf,var(--gold) 45%,var(--gold2) 80%,#fdf3cf);background-size:220% auto;
  box-shadow:0 4px 0 #8a6f1e;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #8a6f1e}
.btn.ghost{background:transparent;color:var(--gold2);border:1.5px solid var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.ghost:hover{background:rgba(212,175,55,.12)}

@media(max-width:760px){
  .ch-card{flex:1 1 150px;min-height:128px}
  .topbar .t small{display:none}
  .view{padding:16px 12px 50px}
  .q-card{padding:24px 20px 22px}
  .q-card .stem{font-size:18px}
  .opt{font-size:16px;padding:12px 14px}
  .idx-dot{width:34px;height:34px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <button class="back-home" onclick="goHome()">‹ 返回首页</button>
  <span class="t">测试中心<small>Quiz Hub · 一题一页 · 教师统一公布</small></span>
  <span class="spacer"></span>
  <span id="timer"></span>
</header>

<main>
  <!-- 选章 -->
  <section id="viewPick" class="view show">
    <div class="preview-bar" id="previewBar" style="display:none"><b>教师预览模式</b> · 仅供查看学生答题界面；开考 / 收卷 / 公布请回到教师工作台「测试控制」操作，学生从主页「测试中心」进入答题<button class="x" onclick="document.getElementById('previewBar').style.display='none'">×</button></div>
    <div class="pick-head">
      <div class="t1">选择章节 · <b>Choose a Chapter</b></div>
      <div class="t2" id="modeTip">每章 5 单选 + 5 翻译 · 30 分钟 · 教师统一收卷与公布</div>
      <div class="bar"></div>
    </div>
    <div class="ch-grid" id="chGrid"></div>
  </section>

  <!-- 等待开始 -->
  <section id="viewWait" class="view">
    <div class="wait-box">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg></div>
      <h2 id="waitTitle">测试尚未开始</h2>
      <p id="waitMsg">本章节测试由任课教师统一开启，请稍候…</p>
      <div class="hint">页面会自动检测开始状态，无需刷新</div>
    </div>
  </section>

  <!-- 一题一页 -->
  <section id="viewQuiz" class="view">
    <div class="qz-wrap">
      <div class="qz-head">
        <div class="sec" id="qzSec">Chapter</div>
        <button class="quit" onclick="confirmQuit()">退出 Exit</button>
      </div>
      <div class="idx-bar" id="idxBar"></div>
      <div class="q-card" id="qCard"></div>
      <div class="q-nav">
        <button class="btn-prev" id="btnPrev" onclick="nav(-1)">‹ 上一题 Previous</button>
        <span class="mid" id="qPos">1 / 10</span>
        <button class="btn-next" id="btnNext" onclick="nav(1)">下一题 Next ›</button>
      </div>
    </div>
  </section>

  <!-- 已提交等待 -->
  <section id="viewSubmitted" class="view">
    <div class="sub-box">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h2>已提交 Submitted</h2>
      <p>你的答卷已提交并锁定。<br>成绩与参考答案将在 <b style="color:var(--gold2)">教师点击「结束测试」</b>后统一公布。</p>
      <div class="hint">页面会自动检测公布状态，无需刷新</div>
    </div>
  </section>

  <!-- 结果 -->
  <section id="viewResult" class="view">
    <div id="resBody"></div>
  </section>
</main>

<!-- 确认弹层 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h3 id="mTitle">提示</h3>
    <p id="mMsg"></p>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<script>
/* ================= 配置 ================= */
const CONFIG = {
  API_URL: 'https://1311686407-6z755znqlt.ap-guangzhou.tencentscf.com'   /* 部署后填入：https://<你的域名>/api（URL 模式） */
};
const API_URL = CONFIG.API_URL;
const ONLINE = !!API_URL;
const KEYS = ['A','B','C','D'];
const TOTAL = 10;
const TIME_MIN = 30;
const POLL_MS = 8000;

/* ================= 题库（9 章） ================= */
const QUIZ = {
1:{cn:'经济学是什么',en:'What Is Economics?',mc:['A','D','B','B','C'],q:['Economics is best defined as the study of ______','Because people respond to incentives, ______','Which of the following best describes the primary focus of microeconomics?','According to the passage, positive economics is often referred to as ______.','Which of the following statements about normative economics is TRUE?'],

      '<div class="cn">'+c.cn+'</div><div class="en">'+c.en+'</div>'+
      (open?'<div class="meta">5 单选 + 5 翻译 · '+TIME_MIN+' 分钟</div>':'<div class="tag-lock">本章测试未开放 · Locked</div>');
    if(open)el.onclick=IS_PREVIEW?()=>openModal('教师预览模式','正式考试请用教师工作台「测试控制」管理；学生从主页「测试中心」进入答题。','<button class="btn ghost" onclick="closeModal()">知道了</button>'):()=>startQuiz(+n);
    g.appendChild(el);
  });
  $('#modeTip').textContent=ONLINE?(openChapters?'已开放章节由教师按班级统一管理，仅显示本班开放的测试':'每章 5 单选 + 5 翻译 · 30 分钟 · 教师统一收卷与公布'):'本地演示模式（未配置 API_URL）：答题后即时查看结果';
}
function loadChapters(){
  if(!ONLINE){renderPick();return;}
  api('my_chapters').then(d=>{
    if(d.ok&&d.data&&d.data.all){openChapters=null;}
    else if(d.ok&&d.data){const m={};d.data.quiz.forEach(ch=>m[ch]=true);openChapters=m;}
    else{openChapters={1:true};}
    renderPick();
  }).catch(()=>{openChapters={1:true};renderPick();});
}

/* ================= 进入试卷 ================= */
function startQuiz(n){
  cur=n;submitted=false;
  $('#qzSec').innerHTML='第 '+n+' 章 · '+QUIZ[n].cn+'<small>'+QUIZ[n].en+'</small>';
  $('#timer').style.display='inline-flex';
  if(ONLINE)checkStatusAndRoute();
  else{startDemo();}
}
function startDemo(){
  exam={status:'running',ends_at:Date.now()+TIME_MIN*60000};
  loadDraft();
  enterQuiz();
  startClock();
}

/* ---------- 在线：查状态并分流 ---------- */
function checkStatusAndRoute(){
  api('test_status',{ch:cur}).then(d=>{
    if(!d.ok)return failApi(d);
    exam=d.data;
    if(d.data.status==='none'){enterWait('测试尚未开始','本章节测试由任课教师统一开启，请稍候…');pollWait();}
    else if(d.data.status==='running'){
      loadDraft();enterQuiz();startClock();
      pollRunning();
    }else{ /* ended：若已交过卷 → 看结果；否则提示已结束 */
      api('my_result',{ch:cur}).then(m=>{
        if(m.ok&&m.data&&m.data.result){renderResult(m.data.result);}
        else{enterWait('本章测试已结束','教师已结束本测试，你未提交答卷，无法查看结果。',false);}
      }).catch(()=>failApi({error:'网络错误'}));
    }
  }).catch(()=>failApi({error:'无法连接服务器，请检查网络'}));
}
function enterWait(title,msg,poll){
  $('#waitTitle').textContent=title;$('#waitMsg').innerHTML=msg;
  show('viewWait');
  if(poll!==false){clearPolls();pollTimer=setInterval(()=>{
    api('test_status',{ch:cur}).then(d=>{
      if(d.ok&&d.data&&d.data.status==='running'){clearPolls();loadDraft();enterQuiz();startClock();pollRunning();}
    }).catch(()=>{});
  },POLL_MS);}
}
function failApi(d){
  openModal('提示',esc((d&&d.error)||'操作失败'),'<button class="btn" onclick="closeModal();goHome()">返回</button>');
  $('#timer').style.display='none';
}

/* ================= 本地草稿 ================= */
function draftKey(){return 'quiz_draft_'+cur;}
function loadDraft(){
  try{
    const s=localStorage.getItem(draftKey());
    if(s){const d=JSON.parse(s);answers=d.answers||{mc:[null,null,null,null,null],tr:['','','','','']};}
    else answers={mc:[null,null,null,null,null],tr:['','','','','']};
  }catch(e){answers={mc:[null,null,null,null,null],tr:['','','','','']};}
  curIdx=0;
}
function saveDraft(){
  try{localStorage.setItem(draftKey(),JSON.stringify({ch:cur,answers,updated_at:Date.now()}));}catch(e){}
}
function clearDraft(){try{localStorage.removeItem(draftKey());}catch(e){}}

/* ================= 答题（一题一页） ================= */
function enterQuiz(){
  renderIdx();
  renderQ();
  show('viewQuiz');
  window.scrollTo(0,0);
}
function renderIdx(){
  const c=QUIZ[cur];
  $('#idxBar').innerHTML=c.q.concat(['trans']).map((x,i)=>{
    const done=i<5?answers.mc[i]!==null:answers.tr[i-5].trim()!=='';
    const cls='idx-dot'+(done?' done':'')+(i===curIdx?' cur':'');
    return '<div class="'+cls+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('');
  $('#qPos').textContent=(curIdx+1)+' / '+TOTAL;
  $('#btnNext').textContent=(curIdx===TOTAL-1)?'交卷 Submit ›':'下一题 Next ›';
}
function jump(i){curIdx=i;renderIdx();renderQ();}
function nav(d){
  const n=curIdx+d;
  if(n<0||n>9)return;
  if(n===10){confirmSubmit();return;}
  curIdx=n;renderIdx();renderQ();
}
function renderQ(){
  const c=QUIZ[cur];
  const qCard=$('#qCard');
  if(curIdx<5){
    const i=curIdx;
    qCard.innerHTML='<div class="q-no">MULTIPLE CHOICE · 每题 10 分</div><div class="q-type mc">单选 Multiple Choice</div>'+
      '<div class="stem"><b style="color:var(--gold2)">'+String(i+1)+'.</b> '+esc(c.q[i])+'</div>'+
      '<div class="opts">'+c.o[i].map((op,j)=>
        '<button class="opt'+(answers.mc[i]===j?' sel':'')+'" onclick="pickMc('+j+')">'+
        '<span class="k">'+KEYS[j]+'</span><span>'+esc(op)+'</span></button>').join('')+'</div>';
  }else{
    const i=curIdx-5,t=c.tr[i];
    const dir=t[0]==='e2c'?'英译中':'中译英';
    qCard.innerHTML='<div class="q-no">TRANSLATION · 满分 5 分</div><div class="q-type">翻译 '+dir+'</div>'+
      '<div class="stem"><b style="color:var(--gold2)">'+String(i+1)+'.</b> '+esc(t[1])+'</div>'+
      '<textarea placeholder="在此输入你的译文…" oninput="saveTrans(this.value)">'+esc(answers.tr[i])+'</textarea>';
  }
}
function pickMc(j){
  answers.mc[curIdx]=j;saveDraft();renderIdx();
}
function saveTrans(v){
  answers.tr[curIdx-5]=v;saveDraft();
  renderIdx();
}

/* ================= 倒计时 ================= */
function startClock(){
  if(clockTimer)clearInterval(clockTimer);
  clockTimer=setInterval(tick,1000);tick();
}
function tick(){
  const el=$('#timer');
  if(!exam)return;
  const remain=Math.max(0,Math.floor((exam.ends_at-Date.now())/1000));
  el.textContent='⏱ '+fmt(remain);
  el.classList.toggle('warn',remain<=300&&remain>0);
  if(remain<=0){
    clearInterval(clockTimer);
    if(!submitted)autoSubmit('时间到，自动收卷');
  }
}
/* 在线：教师提前结束 → 自动收卷并公布 */
function pollRunning(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(()=>{
    api('test_status',{ch:cur}).then(d=>{
      if(d.ok&&d.data&&d.data.status==='ended'){
        clearPolls();
        if(!submitted)autoSubmit('教师已结束测试，正在收卷…');
        else{api('my_result',{ch:cur}).then(m=>{if(m.ok&&m.data&&m.data.result)renderResult(m.data.result);}).catch(()=>{});}
      }
    }).catch(()=>{});
  },POLL_MS);
}

/* ================= 交卷 ================= */
function confirmSubmit(){
  let blank=0;
  for(let i=0;i<5;i++)if(answers.mc[i]===null)blank++;
  for(let i=0;i<5;i++)if(!answers.tr[i].trim())blank++;
  openModal('确认交卷',
    (blank?'还有 <b style="color:var(--no)">'+blank+'</b> 题未作答，未作答部分计 0 分。<br>':'')+
    '交卷后答案将锁定，不能修改。确定交卷吗？',
    '<button class="btn ghost" onclick="closeModal()">继续检查</button>'+
    '<button class="btn" onclick="closeModal();doSubmit()">确认交卷</button>');
}
function doSubmit(){autoSubmit('交卷成功');}
function autoSubmit(tip){
  submitted=true;clearPolls();clearDraft();
  if(!ONLINE){localJudge();return;}
  api('submit',{ch:cur,mc:answers.mc.map(i=>i===null?null:KEYS[i]),trans:answers.tr}).then(d=>{
    if(d.ok){enterSubmitted();}
    else{failApi(d);submitted=false;}
  }).catch(()=>{failApi({error:'网络错误，交卷未成功，请重试'});submitted=false;});
}
function enterSubmitted(){
  $('#timer').style.display='none';
  show('viewSubmitted');
  clearPolls();
  pollTimer=setInterval(()=>{
    api('my_result',{ch:cur}).then(m=>{
      if(m.ok&&m.data&&m.data.result){clearPolls();renderResult(m.data.result);}
    }).catch(()=>{});
  },POLL_MS);
}
function confirmQuit(){
  openModal('退出本卷','退出后本次作答保留在本地草稿，但不会提交。确定退出吗？',
    '<button class="btn ghost" onclick="closeModal()">继续作答</button>'+
    '<button class="btn" onclick="closeModal();clearPolls();$(\'#timer\').style.display=\'none\';show(\'viewPick\')">退出</button>');
}

/* ================= 本地判分（演示模式） ================= */
function localJudge(){
  const c=QUIZ[cur];
  let mcScore=0;
  const mcDetail=c.mc.map((ans,i)=>{
    const picked=answers.mc[i]===null?null:KEYS[answers.mc[i]];
    const right=picked===ans;if(right)mcScore+=10;
    return {q:i+1,stem:c.q[i],ans,picked,right};
  });
  const trDetail=c.tr.map((t,i)=>({q:i+1,dir:t[0],src:t[1],ref:t[2],answer:answers.tr[i]||'',score:0,comment:''}));
  renderResult({mc_score:mcScore,trans_score:0,total:mcScore,mc:mcDetail,trans:trDetail,trans_scores:[]});
}

/* ================= 结果页 ================= */
function renderResult(r){
  clearPolls();$('#timer').style.display='none';
  const ringR=58;window.__circ=2*Math.PI*ringR;
  const mc=r.mc||[], tr=r.trans||[], trs=(r.trans_scores||[]);
  let transScore=r.trans_score||0;
  $('#resBody').innerHTML=
  '<div class="score-hero"><div class="score-ring"><svg viewBox="0 0 132 132">'+
    '<circle class="bg" cx="66" cy="66" r="'+ringR+'" fill="none" stroke-width="11"/>'+
    '<circle class="fg" id="ringFg" cx="66" cy="66" r="'+ringR+'" fill="none" stroke-width="11" stroke-dasharray="'+window.__circ+'" stroke-dashoffset="'+window.__circ+'"/>'+
  '</svg><div class="num"><b id="scoreNum">0</b><span>/ 100</span></div></div>'+
  '<div class="score-info"><div class="lvl" id="lvl">评分中…</div>'+
  '<div class="line">单选：<b>'+r.mc_score+'</b> / 50 分</div>'+
  '<div class="line">翻译：<b>'+transScore+'</b> / 50 分</div>'+
  '<div class="line" style="color:var(--dim)">第 '+cur+' 章 · '+QUIZ[cur].cn+'</div></div></div>'+
  '<div class="r-block"><div class="r-title">I · 多项选择 Multiple Choice</div>'+
  mc.map(m=>'<div class="r-item '+(m.right?'ok':'bad')+'"><div class="q-line">'+
    '<span class="mark">'+(m.right?'✓':'✕')+'</span>'+
    '<span style="flex:1">'+(m.q)+'. '+esc(m.stem)+'</span>'+
    '<span class="s2">'+(m.right?'+10':'0')+'</span></div>'+
    (m.right?'':'<div class="your">你的答案：'+(m.picked||'未作答')+'</div>')+
    '<div class="ans">正确答案：<b>'+m.ans+'</b></div></div>').join('')+'</div>'+
  '<div class="r-block"><div class="r-title">II · 翻译 Translation（AI 评分 0~5/句）</div>'+
  tr.map((t,i)=>{
    const sc=trs[i]||{score:t.score||0,comment:t.comment||''};
    return '<div class="r-item"><div class="q-line"><span style="flex:1"><b>'+(i+1)+'.</b> '+(t.dir==='e2c'?'英译中':'中译英')+'</span>'+
      '<span class="s2">'+sc.score+'</span></div>'+
      '<div class="ref"><b>你的译文：</b>'+(t.answer?esc(t.answer):'<i style="color:var(--no)">（未作答）</i>')+'</div>'+
      '<div class="ref"><b>参考答案：</b>'+esc(t.ref)+'</div>'+
      (sc.comment?'<div class="ai-line"><b>AI 评语：</b>'+esc(sc.comment)+'</div>':'')+'</div>';
  }).join('')+'</div>'+
  '<div class="action-row"><button class="btn ghost" onclick="show(\'viewPick\')">返回选章 Back</button></div>';
  show('viewResult');
  let t=0;
  const step=()=>{t=Math.min(r.total,t+5);$('#scoreNum').textContent=t;
    $('#ringFg').style.strokeDashoffset=window.__circ*(1-t/100);
    $('#lvl').textContent=level(t);
    if(t<r.total)requestAnimationFrame(step);};
  setTimeout(step,80);window.scrollTo(0,0);
}
function level(t){if(t>=90)return '优秀 Excellent';if(t>=75)return '良好 Good';if(t>=60)return '及格 Pass';return '需加油 Keep Practicing';}

loadChapters();
if(ONLINE&&!token()&&!IS_PREVIEW){
  openModal('请先登录','测试中心需要学生账号（学号 + 邀请码）登录后使用。','<button class="btn" onclick="location.href=\'login.html\'">去登录</button>');
}
</script>
</body>
</html>
